# MarioCode update server — nginx site config.
# Mounted read-only into the `mariocode-updates` container as
# /etc/nginx/conf.d/default.conf (see setup.sh). Serves ONLY the flat update
# artifacts that publish.mjs places in /opt/mariocode-updates/public.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # Health probe for setup.sh / publish.mjs. No listing, no version leak.
    location = / {
        default_type text/plain;
        return 200 "MarioCode update server\n";
    }

    # Update manifest. Never cached: electron-updater must always see the
    # newest version, and publish.mjs replaces it atomically (mv) last.
    location ~ ^/[A-Za-z0-9._-]+\.yml$ {
        types { }
        default_type "text/yaml; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Installers + blockmaps. Byte ranges (incl. multi-range, used by
    # electron-updater's differential download) are nginx defaults.
    # "no-cache" (revalidate via ETag) rather than immutable: repackaging the
    # same version reuses the same file name with different bytes.
    location ~ ^/[A-Za-z0-9._-]+\.(exe|blockmap|zip|dmg)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
