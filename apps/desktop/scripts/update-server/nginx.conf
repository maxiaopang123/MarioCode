# MarioCode update server — nginx site config.
# Mounted read-only into the `mariocode-updates` container as
# /etc/nginx/conf.d/default.conf (see setup.sh). Serves ONLY the download
# homepage (/ + /site/*) and the flat update artifacts that publish.mjs places
# in /opt/mariocode-updates/public.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # Download homepage (scripts/update-server/www, uploaded by
    # `publish.mjs --site`). Also the health probe for setup.sh / publish.mjs.
    # The page reads latest.yml / latest-mac.yml itself, so it never needs
    # editing per release.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
    location = /index.html {
        return 301 /;
    }
    # Page assets (css / js / svg). ^~ so the update-file regexes below never
    # claim them.
    location ^~ /site/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Update manifest. Never cached: electron-updater must always see the
    # newest version, and publish.mjs replaces it atomically (mv) last.
    location ~ ^/[A-Za-z0-9._-]+\.yml$ {
        types { }
        default_type "text/yaml; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Installers + blockmaps. Byte ranges (incl. multi-range, used by
    # electron-updater's differential download) are nginx defaults.
    # "no-cache" (revalidate via ETag) rather than immutable: repackaging the
    # same version reuses the same file name with different bytes.
    location ~ ^/[A-Za-z0-9._-]+\.(exe|blockmap|zip|dmg)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
