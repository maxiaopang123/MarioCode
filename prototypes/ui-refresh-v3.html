<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../apps/desktop/src/renderer/favicon.png">
<title>MarioCode · 界面焕新原型 v3（布局重构 · 分栏工作台）</title>
<style>
  /* =========================================================================
   * 界面焕新 · 方向 C「沉静工作台」交互原型(在 ui-refresh.html 方向 B 的基础上重构)
   *
   * 用法:直接双击在浏览器里打开,或 `node prototypes/.serve.mjs` 后访问
   *   http://127.0.0.1:8899/ui-refresh-v2.html
   * 地址栏 hash 可直接定位(& 或 , 分隔):#dark、#welcome、#settings,dark、#approve、#plan、#ask、#proj、#spec,both
   *
   * 和方向 B 比,主要改了这些:
   *  - 标题栏只留品牌、居中的命令面板(搜索 Ctrl K)和窗口按钮;面包屑、分支、活动胶囊移进工作区卡头
   *  - 三栏合成「侧栏 + 一张工作区卡片」,右侧面板用细线内嵌在卡片里,不再是第三张浮卡
   *  - 侧栏:主按钮「新建会话」+ 三个入口 + 会话列表;会话行带项目色块、工作树标记、运行计时
   *  - 工具步骤合进一个容器,细线分行,头部给出成功 / 失败 / 进行中汇总;失败行整行淡红底
   *  - 助手回复带署名行(模型 · 时间 · 用时),用户气泡更轻
   *  - 设置页:主题用缩略图选,字号带实时预览,右侧「本页」目录吃掉原来的大片留白
   *  - 暖中性灰打底;深色下卡片与底色拉开到 13 级明度;浅色下 Git「M」标记用琥珀底色徽标
   * ========================================================================= */

  :root{
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,Consolas,monospace;
    --r-sm:6px;   /* 徽标、行内代码、树行、菜单项 */
    --r-md:8px;   /* 按钮、输入框、列表行、胶囊 */
    --r-lg:12px;  /* 卡片、代码块、步骤容器、停靠卡片 */
    --r-xl:14px;  /* 工作区卡片、输入框 */
    --dur-1:120ms;
    --dur-2:220ms;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  /* ===== 浅色:暖中性灰("R G B" 三元组,与 styles.css 同一约定) ===== */
  /* ===== 配色取自应用图标(build/icon-source.png):暖白底 + 深石墨 #283833 + 灰薄荷 #8BC0A3 =====
   * --primary  = 主操作(发送、主按钮、新建):浅色下用图标的深石墨,深色下用图标的薄荷
   * --accent   = 点缀(选中细条、进度、开关、焦点环、运行中):薄荷系;小号文字用更深的 --accent-strong(白底 5.6:1)
   * 中性灰整体带一点点绿灰,和图标的墨绿同一色相,不再是纯暖灰 */
  [data-theme]{
    --bg:239 241 239;
    --surface:255 255 255;
    --surface-2:247 249 247;
    --hover:240 243 241;
    --active:231 236 233;
    --edge:228 233 230;
    --edge-strong:208 215 211;
    --content:26 34 31;
    --content-2:78 89 84;
    --content-3:108 119 114;   /* 白底 4.8:1,小字也过 AA */
    --primary:40 56 51;        /* 图标深石墨 #283833 */
    --primary-hover:28 41 37;
    --on-primary:255 255 255;
    --accent:92 160 128;       /* 薄荷加深一档 #5CA080,填充用 */
    --accent-strong:44 112 83; /* #2C7053,链接 / 小号绿字 */
    --on-accent:255 255 255;
    --mint:139 192 163;        /* 图标原色 #8BC0A3,只做大面积浅色点缀 */
    --danger:220 38 38;
    --warning:180 83 9;
    --info:109 40 217;
    --success:44 112 83;
    --bubble:240 244 241;
    --syn-kw:124 58 237;
    --syn-str:15 118 110;
    --syn-fn:37 99 235;
    --e1:0 1px 2px rgb(28 25 23 / .05);
    --e2:0 8px 20px -10px rgb(28 25 23 / .16), 0 2px 4px -2px rgb(28 25 23 / .05);
    --e3:0 24px 48px -18px rgb(28 25 23 / .26), 0 6px 12px -6px rgb(28 25 23 / .08);
    --w-base:400;
    color-scheme:light;
  }

  /* ===== 深色:近黑底 + 明显抬起的卡片层 ===== */
  [data-theme="dark"]{
    --bg:10 13 12;
    --surface:22 27 25;
    --surface-2:28 34 31;
    --hover:35 42 39;
    --active:44 52 48;
    --edge:40 48 45;
    --edge-strong:60 70 66;
    --content:234 239 236;
    --content-2:173 184 178;
    --content-3:132 143 137;
    --primary:139 192 163;     /* 深色下主操作直接用图标薄荷,上面配墨绿字 */
    --primary-hover:162 209 183;
    --on-primary:18 31 25;
    --accent:139 192 163;
    --accent-strong:170 215 190;
    --on-accent:18 31 25;
    --mint:139 192 163;
    --danger:248 113 113;
    --warning:251 191 36;
    --info:167 139 250;
    --success:170 215 190;
    --bubble:34 42 38;
    --syn-kw:196 181 253;
    --syn-str:94 234 212;
    --syn-fn:147 197 253;
    --e1:0 1px 2px rgb(0 0 0 / .4);
    --e2:0 12px 28px -10px rgb(0 0 0 / .6), 0 0 0 1px rgb(255 255 255 / .03);
    --e3:0 28px 56px -16px rgb(0 0 0 / .75), 0 0 0 1px rgb(255 255 255 / .05);
    --w-base:450;
    color-scheme:dark;
  }

  /* ===== 原型外壳(不属于设计稿) ===== */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font-ui);background:#e4e4e0;color:#1f2328;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none;cursor:pointer}
  .proto-bar{height:52px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#fff;border-bottom:1px solid #d9d9d4}
  .pb-title{display:flex;flex-direction:column;line-height:1.3;margin-right:auto}
  .pb-title b{font-size:14px;font-weight:600}
  .pb-title span{font-size:12px;color:#6b6b66}
  .pb-ctrls{display:flex;gap:12px}
  .pseg{display:inline-flex;padding:2px;border-radius:8px;background:#efefeb}
  .pseg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;font-size:13px;color:#4b4b46;cursor:pointer}
  .pseg button[aria-pressed="true"]{background:#fff;color:#111;font-weight:500;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
  .stage{height:calc(100vh - 52px);padding:20px;display:flex;gap:20px;justify-content:center;align-items:flex-start;overflow:auto}
  .frame{flex:1 1 auto;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -24px rgb(0 0 0 / .35),0 0 0 1px rgb(0 0 0 / .08)}
  .stage.single .frame{width:100%;height:100%;min-width:1100px}
  .stage.both .frame{flex:none;width:1280px;height:800px;zoom:var(--z,.5)}

  /* ===== 应用骨架 ===== */
  .app{height:100%;display:flex;flex-direction:column;background:rgb(var(--bg));color:rgb(var(--content));font-family:var(--font-ui);font-size:13px;line-height:1.45;font-weight:var(--w-base);transition:background-color var(--dur-2) var(--ease),color var(--dur-2) var(--ease)}
  .app ::selection,.spec ::selection{background:rgb(var(--accent) / .22)}
  .app :focus-visible,.spec :focus-visible{outline:2px solid rgb(var(--accent) / .55);outline-offset:1px}
  .app ::-webkit-scrollbar,.spec::-webkit-scrollbar{width:10px;height:10px}
  .app ::-webkit-scrollbar-thumb,.spec::-webkit-scrollbar-thumb{background:rgb(var(--content) / .13);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  .app ::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--content) / .25)}
  .app ::-webkit-scrollbar-track{background:transparent}
  .app:not([data-view="chat"]) .only-chat,.app:not([data-view="welcome"]) .only-welcome,
  .app:not([data-view="settings"]) .only-settings,.app[data-view="settings"] .not-settings{display:none !important}
  .app[data-theme="dark"] .only-light,.app[data-theme="light"] .only-dark{display:none}

  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:14px;height:14px}
  .ic.xs{width:12px;height:12px}
  .ic.lg{width:20px;height:20px}
  .mono{font-family:var(--font-mono)}
  .num{font-variant-numeric:tabular-nums}
  .ml-auto{margin-left:auto}
  .grow{flex:1}
  .muted{color:rgb(var(--content-3))}

  .icon-btn{width:28px;height:28px;flex:none;border:0;border-radius:var(--r-md);background:transparent;display:inline-grid;place-items:center;color:rgb(var(--content-3));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .icon-btn:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .icon-btn.on{background:rgb(var(--active));color:rgb(var(--content))}
  .icon-btn.sm{width:24px;height:24px;border-radius:var(--r-sm)}
  .kbd{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid rgb(var(--edge));border-bottom-width:2px;border-radius:5px;background:rgb(var(--surface));font-family:var(--font-mono);font-size:10.5px;font-weight:500;line-height:1;color:rgb(var(--content-3))}
  .chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:rgb(var(--hover));color:rgb(var(--content-2));font-size:11.5px;white-space:nowrap}
  .badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:rgb(var(--accent) / .14);color:rgb(var(--accent-strong));font-size:10.5px;font-weight:600;line-height:1}
  .badge.neutral{background:rgb(var(--active));color:rgb(var(--content-2))}
  .dot{width:7px;height:7px;flex:none;border-radius:50%;background:rgb(var(--accent))}
  .dot.warn{background:rgb(var(--warning))}
  .dot.bad{background:rgb(var(--danger))}
  .dot.idle{background:rgb(var(--content-3) / .6)}
  .spin{width:12px;height:12px;flex:none;border-radius:50%;border:1.5px solid rgb(var(--accent) / .22);border-top-color:rgb(var(--accent));animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring{--p:0%;width:14px;height:14px;flex:none;border-radius:50%;background:conic-gradient(rgb(var(--accent)) 0 var(--p),rgb(var(--edge-strong)) var(--p) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}
  .sep{margin:0 1px;color:rgb(var(--content-3) / .7)}
  .vsep{width:1px;height:14px;flex:none;background:rgb(var(--edge))}
  .avatar{--av:104 114 150;width:18px;height:18px;flex:none;border-radius:5px;display:inline-grid;place-items:center;background:rgb(var(--av) / .15);color:rgb(var(--av));font-size:10.5px;font-weight:650;line-height:1}
  .avatar.xs{width:16px;height:16px;border-radius:4.5px;font-size:10px}
  .avatar.md{width:22px;height:22px;border-radius:6px;font-size:11.5px}
  /* 项目色:低饱和的「雾」色系(石板蓝 / 陶土 / 雾青 …),与图标墨绿同一明度带,不抢正文;深色下提亮一档 */
  [data-theme="dark"] .avatar,[data-theme="dark"] .av-mini{background:rgb(var(--av) / .24);color:rgb(var(--av));filter:brightness(1.45) saturate(.9)}

  /* ===== 标题栏:品牌 | 命令面板 | 窗口按钮 ===== */
  .titlebar{height:44px;flex:none;display:grid;grid-template-columns:264px 1fr 264px;align-items:center;user-select:none}
  .app.no-side .titlebar{grid-template-columns:auto 1fr 264px}
  .tb-brand{display:flex;align-items:center;gap:9px;padding:0 10px 0 14px}
  .logo{width:22px;height:22px;flex:none;border-radius:7px;display:inline-grid;place-items:center;background:linear-gradient(145deg,rgb(var(--accent)),rgb(var(--accent-strong)));color:rgb(var(--on-accent));font-size:11.5px;font-weight:700;box-shadow:inset 0 1px 0 rgb(255 255 255 / .25),0 1px 2px rgb(var(--accent) / .35)}
  .brand{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
  .brand-ver{font-size:11px;color:rgb(var(--content-3))}
  .tb-brand .icon-btn{margin-left:auto}
  .cmdk{justify-self:center;width:min(460px,100%);height:30px;display:flex;align-items:center;gap:8px;padding:0 6px 0 11px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface) / .72);color:rgb(var(--content-3));font-size:12.5px;cursor:text;transition:border-color var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease)}
  .cmdk:hover{border-color:rgb(var(--edge-strong));background:rgb(var(--surface))}
  .cmdk .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .winctl{justify-self:end;display:flex;height:44px}
  .winctl span{width:46px;display:grid;place-items:center;color:rgb(var(--content-2))}
  .winctl span:hover{background:rgb(var(--hover))}
  .winctl span.close:hover{background:#e81123;color:#fff}

  .body{flex:1;min-height:0;display:flex;padding:0 8px 8px 0}
  .app.no-side .body{padding-left:8px}
  .app.no-side .sidebar{display:none}

  /* ===== 左侧栏 ===== */
  .sidebar,.set-nav{width:264px;flex:none;display:flex;flex-direction:column;min-height:0;padding:2px 10px 8px}
  .sidebar[data-sbmode="all"] .only-proj,.sidebar[data-sbmode="proj"] .only-all{display:none !important}
  .sb-new{display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 8px 0 11px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));box-shadow:var(--e1);font-size:13.5px;font-weight:500;color:rgb(var(--content));cursor:pointer;transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .sb-new:hover{border-color:rgb(var(--content-3) / .6);box-shadow:var(--e2)}
  .sb-new .kbd{margin-left:auto}
  .sb-nav{display:flex;flex-direction:column;gap:1px;margin-top:10px}
  .nav-item{position:relative;display:flex;align-items:center;gap:10px;height:30px;padding:0 8px 0 10px;border-radius:var(--r-md);font-size:13.5px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .nav-item .ic{color:rgb(var(--content-3))}
  .nav-item:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .nav-item .meta{margin-left:auto;font-size:11.5px;color:rgb(var(--content-3))}
  .nav-item.active{background:rgb(var(--active));color:rgb(var(--content));font-weight:500}
  .nav-item.active .ic{color:rgb(var(--content))}
  .nav-item.active::before{content:"";position:absolute;left:-6px;top:50%;width:3px;height:14px;margin-top:-7px;border-radius:3px;background:rgb(var(--accent))}

  .sb-head{display:flex;align-items:center;gap:6px;margin:18px 0 4px;padding-left:2px}
  .sb-head .lbl{font-size:12px;font-weight:600;color:rgb(var(--content-2));margin-right:auto;padding-left:8px}
  .mini-seg{display:inline-flex;padding:2px;border-radius:7px;background:rgb(var(--active) / .8)}
  .mini-seg button{height:20px;padding:0 7px;border:0;border-radius:5px;background:transparent;font-size:11.5px;color:rgb(var(--content-3));cursor:pointer}
  .mini-seg button.on{background:rgb(var(--surface));color:rgb(var(--content));box-shadow:var(--e1)}
  [data-theme="dark"] .mini-seg button.on{background:rgb(var(--edge-strong))}
  .sb-scroll{flex:1;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px 8px}
  .sb-group{display:flex;align-items:center;height:26px;margin-top:8px;padding-left:10px;font-size:11.5px;font-weight:500;color:rgb(var(--content-3))}
  .sb-group:first-child{margin-top:2px}
  .sess{position:relative;display:flex;align-items:center;gap:9px;height:32px;padding:0 8px 0 10px;border-radius:var(--r-md);font-size:13.5px;color:rgb(var(--content-2));transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .sess:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess .m{flex:none;font-size:11.5px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .sess .m.run{display:inline-flex;align-items:center;gap:5px;color:rgb(var(--accent-strong));font-weight:500}
  .sess .wt{flex:none;margin:0 -3px 0 -2px;color:rgb(var(--content-3))}
  .sess.active{background:rgb(var(--surface));color:rgb(var(--content));font-weight:500;box-shadow:var(--e1),inset 0 0 0 1px rgb(var(--edge))}
  [data-theme="dark"] .sess.active{background:rgb(var(--active));box-shadow:none}
  .sess.active::before{content:"";position:absolute;left:-6px;top:50%;width:3px;height:14px;margin-top:-7px;border-radius:3px;background:rgb(var(--accent))}
  .sess.unread .t{color:rgb(var(--content));font-weight:500}
  .proj{display:flex;align-items:center;gap:8px;height:32px;margin-top:4px;padding:0 8px 0 8px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:rgb(var(--content));cursor:pointer}
  .proj:hover{background:rgb(var(--hover))}
  .proj .chev{color:rgb(var(--content-3))}
  .proj .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj .m{font-size:11.5px;font-weight:400;color:rgb(var(--content-3))}
  .only-proj .sess{padding-left:36px}
  .sb-more{display:flex;align-items:center;gap:6px;height:28px;padding-left:10px;font-size:12px;color:rgb(var(--content-3))}
  .only-proj .sb-more{padding-left:36px}
  .sb-more:hover{color:rgb(var(--content))}
  .sb-foot{display:flex;align-items:center;gap:2px;padding-top:8px;border-top:1px solid rgb(var(--edge))}
  .sb-foot .nav-item{flex:1}

  /* ===== 工作区卡片 ===== */
  .ws{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:rgb(var(--surface));border:1px solid rgb(var(--edge));border-radius:var(--r-xl);box-shadow:var(--e1)}
  .ws-head{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 18px;border-bottom:1px solid rgb(var(--edge))}
  .crumbs{display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;color:rgb(var(--content-3))}
  .crumbs .cur{font-size:13.5px;font-weight:600;color:rgb(var(--content));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
  .crumbs .chip{margin-left:2px}
  .ws-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
  .activity{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid rgb(var(--edge));border-radius:999px;background:rgb(var(--surface-2));font-size:12px;color:rgb(var(--content-2));white-space:nowrap}
  .mini{width:36px;height:4px;border-radius:999px;background:rgb(var(--edge-strong) / .7);overflow:hidden}
  .mini i{display:block;height:100%;border-radius:inherit;background:rgb(var(--accent))}
  .ws-main{flex:1;min-height:0;display:flex}

  /* ===== 会话 ===== */
  .chat{flex:1;min-width:0;display:flex;flex-direction:column}
  .chat-scroll{flex:1;min-height:0;overflow:auto}
  .chat-col{max-width:760px;margin:0 auto;padding:32px 36px 36px}
  .msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-bottom:22px}
  .bubble{max-width:80%;padding:10px 15px;border-radius:16px 16px 5px 16px;background:rgb(var(--bubble));font-size:15px;line-height:1.6}
  .msg-user .meta{font-size:11px;color:rgb(var(--content-3))}
  .ai-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:rgb(var(--content-3))}
  .ai-mark{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;background:rgb(217 119 87 / .12);color:#d97757}
  .ai-head b{font-weight:600;color:rgb(var(--content))}
  .prose{font-size:15px;line-height:1.72}
  .prose p{margin:0 0 14px}
  .prose strong{font-weight:600}
  .prose h3{display:flex;align-items:center;gap:8px;margin:26px 0 8px;font-size:15.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
  .prose code,.spec code{padding:1px 5px;border:1px solid rgb(var(--edge));border-radius:var(--r-sm);background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:.85em}
  .prose a,.link{border-bottom:1px solid rgb(var(--accent) / .35);color:rgb(var(--accent-strong));cursor:pointer}
  .prose a:hover,.link:hover{border-bottom-color:rgb(var(--accent))}

  /* 工具步骤:一个容器,头部汇总,细线分行 */
  .steps{margin:4px 0 20px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);overflow:hidden;background:rgb(var(--surface))}
  .steps-head{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:rgb(var(--surface-2));font-size:12.5px;color:rgb(var(--content-2));cursor:pointer;user-select:none}
  .steps-head .chev{color:rgb(var(--content-3));transition:transform var(--dur-2) var(--ease)}
  .steps.collapsed .steps-head .chev{transform:rotate(-90deg)}
  .steps.collapsed .step{display:none}
  .steps-head b{font-weight:600;color:rgb(var(--content))}
  .tally{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11.5px;color:rgb(var(--content-3))}
  .tally span{display:inline-flex;align-items:center;gap:5px}
  .tally .dot{width:6px;height:6px}
  .step{display:grid;grid-template-columns:16px 36px minmax(0,1fr) auto;align-items:center;gap:10px;height:38px;padding:0 12px;border-top:1px solid rgb(var(--edge));font-size:13px;cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .step:hover{background:rgb(var(--hover) / .6)}
  .step .st{display:grid;place-items:center;color:rgb(var(--content-3))}
  .step .verb{font-weight:500;color:rgb(var(--content))}
  .step .target{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:12px;color:rgb(var(--content-2))}
  .step .dur{font-size:11.5px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .step.fail{background:rgb(var(--danger) / .05)}
  .step.fail .st,.step.fail .dur{color:rgb(var(--danger))}
  .step.fail .dur{font-weight:500}
  .step.run .dur{color:rgb(var(--accent-strong));font-weight:500}

  .codeblock{margin:12px 0 18px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface-2));overflow:hidden}
  .cb-head{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-bottom:1px solid rgb(var(--edge));font-size:12px;color:rgb(var(--content-2))}
  .cb-head .path{font-family:var(--font-mono);font-size:11.5px}
  .cb-head .chip{height:18px;padding:0 6px;font-size:10.5px;background:rgb(var(--active))}
  .codeblock pre{margin:0;padding:10px 0;overflow:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.75}
  .codeblock .ln{display:grid;grid-template-columns:44px 16px 1fr;white-space:pre}
  .codeblock .ln i{font-style:normal;text-align:right;padding-right:12px;color:rgb(var(--content-3) / .7);user-select:none}
  .codeblock .ln s{text-decoration:none;color:rgb(var(--content-3))}
  .codeblock .ln.add{background:rgb(var(--success) / .08)}
  .codeblock .ln.add s{color:rgb(var(--success))}
  .tok-kw{color:rgb(var(--syn-kw))}
  .tok-str{color:rgb(var(--syn-str))}
  .tok-fn{color:rgb(var(--syn-fn))}
  .tok-com{color:rgb(var(--content-3));font-style:italic}

  .prose table{width:100%;margin:6px 0 18px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);border-collapse:separate;border-spacing:0;overflow:hidden;font-size:13px;line-height:1.5}
  .prose th{padding:9px 14px;border-bottom:1px solid rgb(var(--edge));background:rgb(var(--surface-2));text-align:left;font-size:12px;font-weight:500;color:rgb(var(--content-3))}
  .prose td{padding:9px 14px;border-bottom:1px solid rgb(var(--edge))}
  .prose tr:last-child td{border-bottom:0}
  .pass{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:rgb(var(--accent-strong))}
  .wait{display:inline-flex;align-items:center;gap:6px;color:rgb(var(--content-3))}

  /* 输入框按自身宽度收缩工具条:先去下拉箭头与单位,再把指标组收成只剩上下文 */
  .composer{container-type:inline-size}
  .composer-bar{min-width:0}
  .composer-bar .cchip{min-width:0;flex-shrink:1}
  @container (max-width:700px){
    .composer-bar .cchip .caret,.sess-metrics .m em{display:none}
    .composer-bar .cchip{padding:0 7px}
    .sess-metrics{gap:5px;padding:0 6px}
  }
  @container (max-width:600px){
    .sess-metrics .m:not(:first-child),.sess-metrics .msep{display:none}
  }
  /* 输入框右侧的本会话指标组 */
  .sess-metrics{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:var(--r-md);font-size:11.5px;color:rgb(var(--content-3));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .sess-metrics:hover{background:rgb(var(--hover));color:rgb(var(--content-2))}
  .sess-metrics .m{display:inline-flex;align-items:center;gap:4px}
  .sess-metrics .m b{font-weight:500;color:rgb(var(--content-2))}
  .sess-metrics .m em{font-style:normal}
  .sess-metrics .m .ic{color:rgb(var(--accent-strong))}
  .sess-metrics .msep{width:1px;height:11px;background:rgb(var(--edge-strong))}
  .sess-metrics .ring{width:12px;height:12px}

  /* ===== 缓存率 / 输出速度 ===== */
  .ai-head .perf{display:inline-flex;align-items:center;gap:4px;height:20px;margin-left:2px;padding:0 7px;border-radius:999px;background:rgb(var(--hover));font-size:11.5px;color:rgb(var(--content-2));font-variant-numeric:tabular-nums;cursor:help}
  .ai-head .perf:first-of-type{margin-left:6px}
  .ai-head .perf .ic{color:rgb(var(--accent-strong))}
  .perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pcard{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid rgb(var(--edge));border-radius:10px;background:rgb(var(--surface-2));cursor:help}
  .pcard .pl{font-size:11.5px;color:rgb(var(--content-3))}
  .pcard .pv{display:flex;align-items:baseline;gap:4px}
  .pcard .pv b{font-size:20px;font-weight:650;letter-spacing:-.02em;color:rgb(var(--content))}
  .pcard .pv em{font-style:normal;font-size:11.5px;color:rgb(var(--content-3));white-space:nowrap}
  .pcard .ps{white-space:nowrap}
  .pcard .ps{font-size:11.5px;color:rgb(var(--content-3))}
  .pcard .ps b{font-weight:600;color:rgb(var(--content-2))}
  .spark{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
  .spk-l{flex:none;font-size:11.5px;color:rgb(var(--content-3))}
  .spark .bars{flex:1;height:28px;display:flex;align-items:flex-end;gap:4px}
  .spark .bars i{flex:1;height:max(3px,var(--h));border-radius:3px 3px 1px 1px;background:rgb(var(--accent) / .35)}
  .spark .bars i.cur{background:rgb(var(--accent))}
  .spark .bars i.low{background:rgb(var(--warning) / .55)}

  /* ===== 回复里的图片 ===== */
  .md-img{max-width:520px;margin:10px 0 16px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);overflow:hidden;background:rgb(var(--surface-2))}
  .md-img .pic{position:relative;aspect-ratio:3/2;display:grid;place-items:center;cursor:zoom-in}
  .pic-logo{width:22%;height:auto;filter:drop-shadow(0 10px 24px rgb(0 0 0 / .35))}
  .md-img .bar{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 11px;border-top:1px solid rgb(var(--edge));font-size:12px;color:rgb(var(--content-3))}
  .md-img .bar .nm{font-family:var(--font-mono);font-size:12px;color:rgb(var(--content))}
  .md-img .bar .acts{margin-left:auto;display:flex;gap:1px}
  .zoom{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgb(0 0 0 / .45);color:#fff;opacity:0;transition:opacity var(--dur-1) var(--ease)}
  .md-img .pic:hover .zoom,.cell:hover .zoom,.cell.hov .zoom{opacity:1}
  .img-grid{max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
  .img-grid .cell{position:relative;aspect-ratio:1;border:1px solid rgb(var(--edge));border-radius:10px;overflow:hidden;cursor:zoom-in;transition:transform var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .img-grid .cell:hover,.img-grid .cell.hov{box-shadow:var(--e2);transform:translateY(-1px)}
  .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgb(0 0 0 / .55));color:#fff;font-family:var(--font-mono);font-size:11px;opacity:0;transition:opacity var(--dur-1) var(--ease)}
  .cell:hover .cap,.cell.hov .cap{opacity:1}
  .art1{background:radial-gradient(70% 90% at 18% 22%,#b5ebcf 0,transparent 58%),radial-gradient(80% 70% at 88% 82%,#6fbf97 0,transparent 62%),linear-gradient(140deg,#2b3f39,#15201d)}
  .art2{background:radial-gradient(60% 60% at 30% 30%,#fef3c7 0,transparent 60%),linear-gradient(160deg,#6fbf97,#22332e)}
  .art3{background:radial-gradient(55% 55% at 70% 35%,#e0e7ff 0,transparent 60%),linear-gradient(200deg,#8bc0a3,#2b3f39 70%)}
  .art4{background:conic-gradient(from 210deg at 50% 60%,#15201d,#6fbf97,#eaf1ed,#6fbf97,#15201d)}
  /* 边界状态:读取中 / 找不到 / 网络图片(默认不自动加载) */
  .img-grid.states .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;cursor:default;border-style:dashed;border-color:rgb(var(--edge-strong));background:rgb(var(--surface-2));text-align:center;transform:none;box-shadow:none}
  .st-t{font-size:12.5px;font-weight:500;color:rgb(var(--content-2))}
  .st-d{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}
  .st-missing .ic{color:rgb(var(--content-3))}
  .st-remote .ic{color:rgb(var(--accent-strong))}
  .st-loading{background:linear-gradient(100deg,rgb(var(--surface-2)) 30%,rgb(var(--hover)) 50%,rgb(var(--surface-2)) 70%) 0 0/200% 100% !important;animation:shimmer 1.4s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* ===== 回复里的文件路径:识别成可点击的标签,单击打开;悬停出卡片 ===== */
  .fchip{display:inline-flex;align-items:center;gap:5px;height:22px;margin:0 1px;padding:0 7px;border:1px solid rgb(var(--edge));border-radius:6px;background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:12px;line-height:1;color:rgb(var(--content));vertical-align:1px;cursor:pointer;transition:border-color var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease)}
  .fchip .ic{color:rgb(var(--content-3))}
  .fchip em{font-style:normal;color:rgb(var(--content-3))}
  .fchip:hover,.fchip.on{border-color:rgb(var(--accent) / .55);background:rgb(var(--accent) / .07)}
  .fchip-wrap{position:relative;display:inline-block}
  .fpop{position:absolute;left:0;top:calc(100% + 6px);z-index:5;display:none;gap:12px;width:360px;padding:10px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface));box-shadow:var(--e3);font-family:var(--font-ui);white-space:normal;line-height:1.45}
  .fchip-wrap:hover .fpop,.fchip-wrap.demo .fpop{display:flex;animation:rise var(--dur-2) var(--ease)}
  .fpop-thumb{width:72px;height:72px;flex:none;border-radius:8px}
  .fpop-body{display:flex;flex-direction:column;gap:3px;min-width:0}
  .fpop-body b{font-size:13px;font-weight:600;color:rgb(var(--content))}
  .fpop-body .muted{font-family:var(--font-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fpop-acts{display:flex;gap:6px;margin-top:6px}
  .fpop-hint{margin-left:8px;padding:1px 6px;border-radius:5px;background:rgb(var(--hover));font-size:11px;font-weight:500;color:rgb(var(--content-3))}
  /* 单击 = 选中(高亮,可配合 Ctrl C 复制路径);双击 = 打开。打开时短暂闪一下给反馈 */
  .fchip.sel{border-color:rgb(var(--accent));background:rgb(var(--accent) / .12);box-shadow:0 0 0 3px rgb(var(--accent) / .12)}
  .fchip.opening{animation:chipOpen 420ms var(--ease)}
  @keyframes chipOpen{40%{transform:scale(.96);background:rgb(var(--accent) / .22)}}

  .files{margin:4px 0 16px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);overflow:hidden}
  .files-head{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border-bottom:1px solid rgb(var(--edge));background:rgb(var(--surface-2));font-size:13px}
  .files-head b{font-weight:600}
  .files-head .btn:first-of-type{margin-left:auto}
  .file-row{display:flex;align-items:center;gap:9px;height:38px;padding:0 14px;font-family:var(--font-mono);font-size:12px;color:rgb(var(--content-3))}
  .file-row .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-row b{font-weight:500;color:rgb(var(--content))}
  .add{color:rgb(var(--success))}
  .del{color:rgb(var(--danger))}
  .diffbar{display:inline-flex;gap:2px}
  .diffbar i{width:6px;height:6px;border-radius:1.5px;background:rgb(var(--edge-strong))}
  .diffbar i.a{background:rgb(var(--success))}
  .diffbar i.d{background:rgb(var(--danger))}

  /* ===== 输入区 ===== */
  .composer-wrap{position:relative;flex:none;padding:0 36px 18px}
  .composer-wrap::before{content:"";position:absolute;left:0;right:10px;top:-24px;height:24px;background:linear-gradient(rgb(var(--surface) / 0),rgb(var(--surface)));pointer-events:none}
  .composer{max-width:760px;margin:0 auto;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-xl);background:rgb(var(--surface));box-shadow:var(--e2);transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .composer:focus-within{border-color:rgb(var(--accent) / .55);box-shadow:var(--e2),0 0 0 3px rgb(var(--accent) / .12)}
  .composer textarea{display:block;width:100%;min-height:54px;padding:14px 16px 2px;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:15px;line-height:1.6;color:rgb(var(--content))}
  .composer textarea::placeholder{color:rgb(var(--content-3))}
  .composer textarea:focus-visible{outline:none}
  .composer-bar{display:flex;align-items:center;gap:2px;padding:6px 8px 8px}
  .cchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:0;border-radius:var(--r-md);background:transparent;font-size:12.5px;color:rgb(var(--content-2));white-space:nowrap;cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .cchip:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .cchip .caret{color:rgb(var(--content-3))}
  .cchip .ic{color:rgb(var(--content-3))}
  .cchip .claude{color:#d97757}
  .cbar-sep{width:1px;height:16px;margin:0 4px;background:rgb(var(--edge))}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:4px}
  .ctx{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:var(--r-md);font-size:11.5px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .send{width:32px;height:32px;flex:none;border:0;border-radius:10px;display:inline-grid;place-items:center;background:rgb(var(--primary));color:rgb(var(--on-primary));box-shadow:inset 0 1px 0 rgb(255 255 255 / .16),0 1px 2px rgb(var(--primary) / .35);cursor:pointer;transition:transform var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease)}
  .send:hover{background:rgb(var(--primary-hover))}
  .send:active{transform:scale(.94)}
  .send .ic{stroke-width:2.1}
  .composer-hint{max-width:760px;margin:8px auto 0;display:flex;justify-content:space-between;font-size:11px;color:rgb(var(--content-3))}
  .composer-hint .kbd{height:16px;font-size:10px;margin:0 2px}

  /* ===== 待确认卡片:停靠在输入框正上方,一次只出现一张 ===== */
  .dock{display:none;max-width:760px;margin:0 auto 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-lg);background:rgb(var(--surface));box-shadow:var(--e3);overflow:hidden;animation:rise var(--dur-2) var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .app[data-prompt="approve"] .dock.approve,.app[data-prompt="plan"] .dock.plan,.app[data-prompt="ask"] .dock.ask{display:block}
  .app[data-prompt="ask"] .composer{opacity:.5;pointer-events:none}
  .dk-head{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 10px 8px 14px}
  .dk-ico{--t:var(--warning);width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;background:rgb(var(--t) / .12);color:rgb(var(--t))}
  .dk-ico.plan{--t:var(--info)}
  .dk-ico.ask{--t:var(--accent-strong)}
  .dk-title{display:flex;flex-direction:column;min-width:0;line-height:1.35}
  .dk-title b{font-size:13.5px;font-weight:600}
  .dk-title span{font-size:12px;color:rgb(var(--content-3))}
  .dk-body{padding:0 14px 14px}
  .dk-cmd{display:flex;align-items:baseline;gap:10px;padding:11px 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:rgb(var(--content))}
  .dk-cmd .k{flex:none;height:18px;padding:0 6px;border-radius:5px;background:rgb(var(--active));font-family:var(--font-ui);font-size:11px;font-weight:600;line-height:18px;color:rgb(var(--content-2))}
  .dk-cmd .pr{color:rgb(var(--content-3))}
  .dk-note{margin:9px 2px 0;font-size:12.5px;line-height:1.55;color:rgb(var(--content-2))}
  .dk-detail{display:none;margin:8px 0 0;padding:10px 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:12px;line-height:1.6;color:rgb(var(--content-2));white-space:pre;overflow:auto}
  .dock.open .dk-detail{display:block}
  .dock.open [data-act="detail"] .ic{transform:rotate(180deg)}
  .dk-foot{display:flex;align-items:center;gap:8px;min-height:50px;padding:8px 10px 8px 14px;border-top:1px solid rgb(var(--edge));background:rgb(var(--surface-2))}
  .dk-foot .muted{font-size:12px}
  .input.dk-input{display:block;width:100%;margin-top:10px}
  .btn .kbd{margin-left:3px;height:16px;padding:0 4px;border:1px solid currentColor;border-bottom-width:1px;background:transparent;color:inherit;opacity:.55}
  .check{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:rgb(var(--content-2));cursor:pointer;user-select:none}
  .check i{position:relative;width:15px;height:15px;flex:none;border:1.5px solid rgb(var(--edge-strong));border-radius:4px;background:rgb(var(--surface));transition:background-color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
  .check.on i{border-color:rgb(var(--accent));background:rgb(var(--accent))}
  .check.on i::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid rgb(var(--on-accent));border-width:0 1.75px 1.75px 0;transform:rotate(45deg)}
  .plan-doc{padding:14px 16px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-size:13px;line-height:1.6}
  .plan-doc b{display:block;margin-bottom:8px;font-size:13.5px;font-weight:600}
  .plan-doc ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px;color:rgb(var(--content-2))}
  .plan-doc li{counter-increment:s;display:flex;gap:10px}
  .plan-doc li::before{content:counter(s);width:18px;height:18px;flex:none;margin-top:2px;border-radius:50%;display:grid;place-items:center;background:rgb(var(--info) / .12);color:rgb(var(--info));font-size:10.5px;font-weight:600}
  .plan-doc code{padding:0 4px;border:1px solid rgb(var(--edge));border-radius:5px;background:rgb(var(--surface));font-family:var(--font-mono);font-size:.86em}
  .q-steps{display:flex;gap:4px;margin-left:4px}
  .q-steps i{width:18px;height:4px;border-radius:999px;background:rgb(var(--edge-strong))}
  .q-steps i.on{background:rgb(var(--accent))}
  .q-text{margin:0 0 10px;font-size:14.5px;font-weight:600;line-height:1.5}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);cursor:pointer;transition:background-color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .opt:hover{background:rgb(var(--hover) / .6)}
  .opt.on{border-color:rgb(var(--accent) / .55);background:rgb(var(--accent) / .05);box-shadow:0 0 0 3px rgb(var(--accent) / .08)}
  .opt b{display:block;font-size:13px;font-weight:600;color:rgb(var(--content))}
  .opt .od{display:block;margin-top:2px;font-size:12px;line-height:1.5;color:rgb(var(--content-3))}
  .radio{position:relative;width:15px;height:15px;flex:none;margin-top:2px;border:1.5px solid rgb(var(--edge-strong));border-radius:50%}
  .opt.on .radio{border-color:rgb(var(--accent))}
  .opt.on .radio::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:rgb(var(--accent))}

  /* ===== 右侧面板:内嵌在工作区卡片里 ===== */
  .inspector{width:300px;flex:none;display:flex;flex-direction:column;border-left:1px solid rgb(var(--edge));background:rgb(var(--surface-2) / .55)}
  .app.no-insp .inspector{display:none}
  .insp-tabs{height:44px;flex:none;display:flex;align-items:stretch;gap:2px;padding:0 8px 0 10px;border-bottom:1px solid rgb(var(--edge))}
  .itab{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border:0;background:transparent;font-size:12.5px;color:rgb(var(--content-3));cursor:pointer}
  .itab:hover{color:rgb(var(--content))}
  .itab.on{color:rgb(var(--content));font-weight:600}
  .itab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:rgb(var(--content))}
  .insp-tabs .tools{margin-left:auto;display:flex;align-items:center;gap:2px}
  .insp-filter{display:flex;align-items:center;gap:7px;height:30px;margin:10px 10px 6px;padding:0 9px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface));color:rgb(var(--content-3));font-size:12.5px}
  .insp-filter .kbd{margin-left:auto}
  .insp-root{display:flex;align-items:center;gap:6px;padding:6px 16px 4px;font-size:11.5px;font-weight:600;color:rgb(var(--content-3))}
  .insp-root .m{margin-left:auto;font-weight:400}
  .tree{flex:1;min-height:0;overflow:auto;padding:0 6px 10px}
  .row{--d:0;display:flex;align-items:center;gap:6px;height:27px;padding:0 8px 0 calc(8px + var(--d) * 14px);border-radius:var(--r-sm);font-size:13px;color:rgb(var(--content-2));white-space:nowrap;cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .row:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .row.sel{background:rgb(var(--active));color:rgb(var(--content));font-weight:500}
  .row .chev,.row .fd{color:rgb(var(--content-3))}
  .chev-sp{display:inline-block;width:12px;flex:none}
  .ft{--ft:var(--content-3);color:rgb(var(--ft))}
  .git{margin-left:auto;min-width:16px;height:16px;padding:0 4px;border-radius:4px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:700;line-height:1}
  .git.m{background:rgb(var(--warning) / .14);color:rgb(var(--warning))}
  .git.a{background:rgb(var(--success) / .14);color:rgb(var(--success))}
  .insp-foot{display:flex;align-items:center;gap:7px;height:38px;flex:none;padding:0 14px;border-top:1px solid rgb(var(--edge));font-size:12px;color:rgb(var(--content-3))}
  .insp-foot b{font-weight:500;color:rgb(var(--content-2))}

  /* ===== 欢迎页 ===== */
  .welcome{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:72px 36px 48px}
  .wl-inner{width:100%;max-width:700px}
  .wl-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:rgb(var(--content-3))}
  .wl-title{margin:0 0 22px;font-size:28px;font-weight:600;line-height:1.25;letter-spacing:-.02em}
  .wl-title span{color:rgb(var(--content-3));font-weight:500}
  .welcome .composer{margin:0}
  .welcome .composer textarea{min-height:80px}
  .ctx-row{display:flex;align-items:center;gap:6px;padding:0 0 0 2px}
  .qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 34px}
  .qa{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface));text-align:left;cursor:pointer;transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
  .qa:hover{border-color:rgb(var(--edge-strong));box-shadow:var(--e2);transform:translateY(-1px)}
  .qa-ico{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgb(var(--hover));color:rgb(var(--content-2))}
  .qa>span:last-child{min-width:0}
  .qa b{display:block;font-size:13px;font-weight:600}
  .qa b+span{display:block;margin-top:2px;font-size:12px;line-height:1.45;color:rgb(var(--content-3))}
  .wl-sec{display:flex;align-items:center;margin:0 0 6px;padding:0 10px}
  .wl-sec h4{margin:0;font-size:12px;font-weight:600;color:rgb(var(--content-2))}
  .wl-sec a{margin-left:auto;font-size:12px;color:rgb(var(--content-3))}
  .wl-sec a:hover{color:rgb(var(--content))}
  .rc{display:grid;grid-template-columns:22px minmax(0,1fr) 140px 76px;align-items:center;gap:12px;height:42px;padding:0 10px;border-radius:var(--r-md);transition:background-color var(--dur-1) var(--ease)}
  .rc+.rc{border-top:1px solid rgb(var(--edge) / .7)}
  .rc:hover{background:rgb(var(--hover))}
  .rc .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:rgb(var(--content))}
  .rc .p{display:flex;align-items:center;gap:6px;font-size:12px;color:rgb(var(--content-3))}
  .rc .m{text-align:right;font-size:12px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}

  /* ===== 设置 ===== */
  .set-back{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:var(--r-md);background:transparent;font-size:13px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .set-back:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .set-search{display:flex;align-items:center;gap:7px;height:32px;margin-top:8px;padding:0 9px 0 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));box-shadow:var(--e1);color:rgb(var(--content-3));transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .set-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:rgb(var(--content))}
  .set-search input::placeholder{color:rgb(var(--content-3))}
  .set-search input:focus-visible{outline:none}
  .set-search:focus-within{border-color:rgb(var(--accent) / .55);box-shadow:0 0 0 3px rgb(var(--accent) / .12)}
  .set-groups{flex:1;min-height:0;overflow:auto;margin:6px -6px 0;padding:0 6px 8px}
  .set-group{height:26px;margin-top:10px;padding-left:10px;line-height:26px;font-size:11.5px;font-weight:500;color:rgb(var(--content-3))}
  .set-groups .nav-item{height:29px;font-size:13px}

  .set-scroll{flex:1;min-height:0;overflow:auto}
  .set-layout{display:grid;grid-template-columns:minmax(0,680px) 168px;justify-content:center;gap:48px;padding:36px 40px 56px}
  .set-pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:26px}
  .set-pagehead .txt{flex:1}
  .set-title{margin:0 0 6px;font-size:24px;font-weight:600;letter-spacing:-.015em}
  .set-desc{margin:0;font-size:13.5px;color:rgb(var(--content-2))}
  .set-sec{margin-bottom:28px;scroll-margin-top:24px}
  .set-sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px 2px}
  .set-sec-h h3{margin:0;font-size:14px;font-weight:600}
  .set-sec-h span{font-size:12px;color:rgb(var(--content-3))}
  .set-box{border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface))}
  .set-row{display:flex;align-items:center;gap:24px;min-height:62px;padding:13px 16px}
  .set-row+.set-row,.set-stack+.set-row,.set-row+.set-stack{border-top:1px solid rgb(var(--edge))}
  .set-row .txt{flex:1;min-width:0}
  .set-row .txt b,.set-stack .txt b{display:block;font-size:13.5px;font-weight:500}
  .set-row .txt span,.set-stack .txt span{display:block;margin-top:3px;font-size:12px;line-height:1.5;color:rgb(var(--content-3))}
  .set-row .ctl{flex:none;display:flex;align-items:center;gap:10px}
  .set-stack{padding:14px 16px 16px}
  .set-stack .txt{margin-bottom:12px}

  .theme-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{padding:0;border:0;background:transparent;text-align:left;cursor:pointer}
  .tile-prev{position:relative;height:84px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgb(var(--edge-strong));transition:box-shadow var(--dur-1) var(--ease)}
  .tile:hover .tile-prev{box-shadow:0 0 0 1px rgb(var(--content-3))}
  .tile.on .tile-prev{box-shadow:0 0 0 2px rgb(var(--accent)),0 0 0 5px rgb(var(--accent) / .15)}
  .tp{position:absolute;inset:0;display:flex;gap:6px;padding:8px 8px 0}
  .tp .s{width:26%;display:flex;flex-direction:column;gap:5px;padding-top:4px}
  .tp .s i{height:4px;border-radius:2px;background:var(--l2)}
  .tp .s i:first-child{width:70%;background:var(--l1)}
  .tp .c{flex:1;border-radius:6px 6px 0 0;background:var(--card);box-shadow:0 0 0 1px var(--ed);padding:9px;display:flex;flex-direction:column;gap:5px}
  .tp .c i{height:4px;border-radius:2px;background:var(--l2)}
  .tp .c i:nth-child(1){width:48%;margin-left:auto;background:var(--l3)}
  .tp .c i:nth-child(2){width:86%}
  .tp .c i:nth-child(3){width:64%}
  .tp .c em{align-self:flex-end;width:14px;height:8px;margin-top:auto;border-radius:3px;background:rgb(var(--accent))}
  .tp.l{--card:#fff;--ed:#e4e9e6;--l1:#95a09a;--l2:#d8dfdb;--l3:#e9eeeb;background:#eff1ef}
  .tp.d{--card:#161b19;--ed:#28302d;--l1:#74807a;--l2:#313a36;--l3:#27302c;background:#0a0d0c}
  .tp.half{clip-path:inset(0 0 0 50%)}
  .tile-lbl{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;font-weight:500}
  .tile-lbl .radio{margin-top:0}
  .tile.on .radio{border-color:rgb(var(--accent))}
  .tile.on .radio::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:rgb(var(--accent))}
  .tile-lbl span{margin-left:auto;font-size:11.5px;font-weight:400;color:rgb(var(--content-3))}

  .segctl{display:inline-flex;padding:2px;border-radius:var(--r-md);background:rgb(var(--active) / .8)}
  .segctl button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border:0;border-radius:var(--r-sm);background:transparent;font-size:12.5px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .segctl button:hover{color:rgb(var(--content))}
  .segctl button.on{background:rgb(var(--surface));color:rgb(var(--content));font-weight:500;box-shadow:var(--e1)}
  [data-theme="dark"] .segctl button.on{background:rgb(var(--edge-strong))}
  .segctl.sm button{height:22px;padding:0 9px;font-size:12px}

  .swatch-row{display:flex;align-items:center;gap:9px}
  .swc{--c:5 150 105;width:20px;height:20px;flex:none;padding:0;border:0;border-radius:50%;background:rgb(var(--c));box-shadow:inset 0 0 0 1px rgb(0 0 0 / .1);cursor:pointer;transition:box-shadow var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
  .swc:hover{transform:scale(1.08)}
  .swc.on{box-shadow:0 0 0 2px rgb(var(--surface)),0 0 0 4px rgb(var(--c))}
  .swatch-name{min-width:64px;font-size:12px;color:rgb(var(--content-3));text-align:right}

  .stepper{display:inline-flex;align-items:stretch;height:30px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));overflow:hidden}
  .stepper button{width:30px;border:0;background:transparent;font-size:15px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .stepper button:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .stepper span{min-width:58px;display:grid;place-items:center;border-left:1px solid rgb(var(--edge));border-right:1px solid rgb(var(--edge));font-size:12.5px;font-variant-numeric:tabular-nums}
  .preview{margin:0 16px 16px;padding:14px 16px;border:1px dashed rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface-2))}
  .preview .pv-lbl{display:block;margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.04em;color:rgb(var(--content-3))}
  .preview .pv-ui{display:flex;align-items:center;gap:8px;font-size:var(--pv-ui,14px);color:rgb(var(--content-2))}
  .preview .pv-chat{margin:8px 0 0;font-size:var(--pv-chat,15px);line-height:1.7}
  .select{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:200px;height:32px;padding:0 9px 0 11px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));font-size:13px;color:rgb(var(--content));cursor:pointer;transition:border-color var(--dur-1) var(--ease)}
  .select .ic{color:rgb(var(--content-3))}
  .select:hover{border-color:rgb(var(--content-3))}
  .select .sw-dot{width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12)}
  .select .lead{display:inline-flex;align-items:center;gap:8px}
  .set-foot{display:flex;align-items:center;gap:8px;margin:0 2px;font-size:12px;color:rgb(var(--content-3))}

  .toc{position:sticky;top:36px;align-self:start;display:flex;flex-direction:column;gap:2px;padding-top:6px}
  .toc h5{margin:0 0 8px;padding-left:12px;font-size:11.5px;font-weight:600;color:rgb(var(--content-3))}
  .toc a{position:relative;display:block;padding:5px 12px;border-left:2px solid rgb(var(--edge));font-size:12.5px;color:rgb(var(--content-3))}
  .toc a:hover{color:rgb(var(--content))}
  .toc a.on{border-left-color:rgb(var(--accent));color:rgb(var(--content));font-weight:500}
  .toc .toc-card{margin-top:22px;padding:12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-size:12px;line-height:1.5;color:rgb(var(--content-3))}
  .toc .toc-card b{display:block;margin-bottom:4px;font-weight:600;color:rgb(var(--content-2))}
  .saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgb(var(--content-3))}
  .saved .ic{color:rgb(var(--accent-strong))}

  /* ===== 基础组件 ===== */
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid transparent;border-radius:var(--r-md);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:background-color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .btn.sm{height:28px;padding:0 10px;font-size:12.5px}
  .btn-primary{background:rgb(var(--primary));color:rgb(var(--on-primary));box-shadow:inset 0 1px 0 rgb(255 255 255 / .14),0 1px 2px rgb(var(--primary) / .3)}
  .btn-primary:hover{background:rgb(var(--primary-hover))}
  .btn-secondary{border-color:rgb(var(--edge-strong));background:rgb(var(--surface));color:rgb(var(--content));box-shadow:var(--e1)}
  .btn-secondary:hover{background:rgb(var(--surface-2))}
  .btn-ghost{background:transparent;color:rgb(var(--content-2))}
  .btn-ghost:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .btn-danger{border-color:rgb(var(--danger) / .35);background:transparent;color:rgb(var(--danger))}
  .btn-danger:hover{background:rgb(var(--danger) / .08)}
  .btn:disabled{opacity:.45;pointer-events:none}
  .input{width:180px;height:32px;padding:0 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);outline:none;background:rgb(var(--surface));font:inherit;font-size:13px;color:rgb(var(--content));transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .input::placeholder{color:rgb(var(--content-3))}
  .input:focus,.input.focused{border-color:rgb(var(--accent) / .6);box-shadow:0 0 0 3px rgb(var(--accent) / .14)}
  .switch{position:relative;display:inline-block;width:32px;height:18px;flex:none;border-radius:999px;background:rgb(var(--edge-strong));cursor:pointer;transition:background-color var(--dur-2) var(--ease)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform var(--dur-2) var(--ease)}
  .switch.on{background:rgb(var(--accent))}
  .switch.on::after{transform:translateX(14px)}
  .tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-sm);background:rgb(var(--info) / .12);color:rgb(var(--info));font-size:11px;font-weight:600}
  .tip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:var(--r-sm);background:rgb(var(--content));color:rgb(var(--surface));font-size:12px;box-shadow:var(--e2)}
  .menu{width:240px;padding:4px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface));box-shadow:var(--e2)}
  .mi{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:var(--r-sm);font-size:13px;color:rgb(var(--content-2));cursor:pointer}
  .mi .ic{color:rgb(var(--content-3))}
  .mi .kbd{margin-left:auto}
  .mi.hov,.mi:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .mi.danger,.mi.danger .ic{color:rgb(var(--danger))}
  .msep{height:1px;margin:4px 6px;background:rgb(var(--edge))}

  /* ===== 设计规范页 ===== */
  .spec{height:100%;overflow:auto;background:rgb(var(--bg));color:rgb(var(--content));font-family:var(--font-ui);font-size:13px;line-height:1.5;font-weight:var(--w-base)}
  .spec-inner{max-width:1000px;margin:0 auto;padding:36px 36px 60px}
  .spec h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.015em}
  .spec .lead{margin:0 0 24px;color:rgb(var(--content-2))}
  .spec section{margin-bottom:16px;padding:22px 24px;border:1px solid rgb(var(--edge));border-radius:var(--r-xl);background:rgb(var(--surface));box-shadow:var(--e1)}
  .spec section.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .spec h3{margin:0 0 14px;font-size:14px;font-weight:600}
  .note{margin:14px 0 0;font-size:12px;color:rgb(var(--content-3))}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{border:1px solid rgb(var(--edge));border-radius:var(--r-lg);overflow:hidden}
  .sw i{display:block;height:44px;border-bottom:1px solid rgb(var(--edge))}
  .sw div{padding:7px 9px 8px}
  .sw b{display:block;font-size:12px;font-weight:500}
  .sw span{display:block;font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}
  .accent-uses{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px}
  .use{display:flex;align-items:center;gap:10px;min-height:34px;font-size:13px;color:rgb(var(--content-2))}
  .use-bar{width:3px;height:16px;border-radius:3px;background:rgb(var(--accent))}
  .ts-row{display:grid;grid-template-columns:90px 1fr 200px;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid rgb(var(--edge))}
  .ts-row:last-child{border-bottom:0}
  .ts-k{font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}
  .ts-u{text-align:right;font-size:12px;color:rgb(var(--content-3))}
  .radii{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .radii div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .radii i{width:56px;height:40px;border:1.5px solid rgb(var(--edge-strong));background:rgb(var(--surface-2))}
  .radii b{font-size:12px;font-weight:600}
  .radii span,.elev span{font-size:11px;line-height:1.4;color:rgb(var(--content-3))}
  .elev{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:6px}
  .elev div{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface))}
  .elev b{font-family:var(--font-mono);font-size:12px}
  .comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
  .comp{display:flex;flex-direction:column;gap:8px}
  .comp .lbl{font-size:11px;font-weight:600;letter-spacing:.04em;color:rgb(var(--content-3))}
  .hstack{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  table.cmp th{padding:8px 12px;border-bottom:1px solid rgb(var(--edge));text-align:left;font-size:12px;font-weight:500;color:rgb(var(--content-3))}
  table.cmp td{padding:9px 12px;border-bottom:1px solid rgb(var(--edge));vertical-align:top}
  table.cmp tr:last-child td{border-bottom:0}
  table.cmp td:nth-child(2),table.cmp td:nth-child(3){color:rgb(var(--content-3))}
  table.cmp td:nth-child(4){font-weight:500}

  @media (prefers-reduced-motion:reduce){
    .app *,.spec *{transition:none !important;animation-duration:0s !important}
  }

  /* =========================================================================
   * v3 布局层「分栏工作台」:沿用 v2 的 token 和组件,只重构布局
   *   ① 最左 60px 项目栏(全部会话 / 各项目 / 定时任务 / 插件 / 手机 / 主题 / 设置)
   *   ② 会话列:当前项目 + 新建 + 搜索 + 筛选页签 + 两行会话卡片(状态、摘要、进度)
   *   ③ 主区:顶栏(标题 + 项目 / 分支 / 引擎 / 开始时间)→ 会话 | 右侧面板 | 竖向工具条
   *   ④ 底部状态栏:连接、分支、改动、代理 | 子代理、任务、用量、定时、手机
   *   ⑤ 设置改为居中浮层,页内用页签切分组
   * 面板全部贴边排布、细线分隔,不再有悬浮卡片。
   * ========================================================================= */
  [data-theme]{--sl:247 249 247;--rail:234 238 235}
  [data-theme="dark"]{--sl:16 20 18;--rail:8 11 10}
  .app{position:relative;overflow:hidden}
  .app[data-view="welcome"] .v-chat,.app:not([data-view="welcome"]) .v-welcome{display:none !important}
  .app:not([data-view="settings"]) .modal-root{display:none}
  .shell{flex:1;min-height:0;display:flex}

  /* ---------- ① 项目栏 ---------- */
  .rail{width:60px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:rgb(var(--rail));border-right:1px solid rgb(var(--edge))}
  /* 品牌 logo:直接引用应用图标导出的 brand-logo.png(与 build/icon.png 同源,见 build/gen_icon.py),
   * 和 renderer 的 BrandLogo.tsx 同一做法:28% 圆角裁切 + 极淡描边 + 轻阴影,浅 / 深色背景上都有清晰边界 */
  /* 与 BrandLogo.tsx 同规则:28px、按主题切 brand-logo.png(深)/ brand-logo-light.png(浅),
   * 图片自带圆角与透明外缘 —— 不加圆角 / 边框 / 阴影,不拉伸不改色。大尺寸用 build/icon-*.svg 矢量。 */
  .brand-logo{width:28px;height:28px;flex:none;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .brand-logo.lg{width:48px;height:48px}
  .rail .brand-logo{margin:4px 0 6px}
  .app[data-theme="dark"] .brand-logo.only-light,.app[data-theme="light"] .brand-logo.only-dark{display:none}
  .wl-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .wl-brand .nm{display:flex;flex-direction:column;line-height:1.3}
  .wl-brand b{font-size:15px;font-weight:650;letter-spacing:-.01em}
  .wl-brand small{font-size:12px;color:rgb(var(--content-3))}
  /* 项目栏尺寸规范:所有格子 36×36、圆角 10;内容统一 28px 视觉块
   * —— logo 28、项目头像 28(圆角 8)、线性图标 18px / 描边 1.6(按字形视觉重量做了个别微调) */
  .rail{gap:4px}
  .rail-sep{width:20px;height:1px;flex:none;margin:6px 0;background:rgb(var(--edge-strong) / .8)}
  .rail-btn{position:relative;width:36px;height:36px;flex:none;padding:0;border:0;border-radius:10px;display:grid;place-items:center;background:transparent;color:rgb(var(--content-3));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .rail-btn:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .rail-btn.on{background:rgb(var(--surface));color:rgb(var(--content));box-shadow:var(--e1),inset 0 0 0 1px rgb(var(--edge))}
  [data-theme="dark"] .rail-btn.on{background:rgb(var(--active));box-shadow:inset 0 0 0 1px rgb(var(--primary) / .35)}
  [data-theme="dark"] .rail-btn.on::before{background:rgb(var(--primary))}
  .rail-btn.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:rgb(var(--content))}
  .rail-btn .ic{width:18px;height:18px;stroke-width:1.6}
  .rail-btn .ic.op-lg{width:19px;height:19px}   /* 字形偏窄(手机)放大一点 */
  .rail-btn .ic.op-sm{width:17px;height:17px}   /* 字形偏满(方块)缩小一点 */
  .pav{--av:104 114 150;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgb(var(--av) / .14);color:rgb(var(--av));font-size:12px;font-weight:650;line-height:1;box-shadow:inset 0 0 0 1px rgb(var(--av) / .18);transition:background-color var(--dur-2) var(--ease),color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  [data-theme="dark"] .pav{background:rgb(var(--av) / .24);filter:brightness(1.45) saturate(.9);box-shadow:inset 0 0 0 1px rgb(var(--av) / .3)}
  .rail-btn.proj:hover .pav{background:rgb(var(--av) / .22)}
  /* 选中项目:不再整块纯色填充,和其它格子一样用浅底卡片 + 左侧指示条,头像只加深一档 */
  .rail-btn.proj.on .pav{background:rgb(var(--av) / .2);box-shadow:inset 0 0 0 1px rgb(var(--av) / .35)}
  .pip{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:rgb(var(--accent));box-shadow:0 0 0 2px rgb(var(--rail))}
  .rail-btn.on .pip{box-shadow:0 0 0 2px rgb(var(--surface))}
  .pip.run{background:rgb(var(--rail));border:1.75px solid rgb(var(--accent) / .25);border-top-color:rgb(var(--accent));animation:spin .9s linear infinite}
  .rail-add{color:rgb(var(--content-3) / .8)}
  .rail-add .ic{width:16px;height:16px}
  .rail-grow{flex:1}

  /* ---------- ② 会话列 ---------- */
  .slist{width:284px;flex:none;display:flex;flex-direction:column;min-height:0;background:rgb(var(--sl));border-right:1px solid rgb(var(--edge))}
  .slist[data-scope="proj"] .only-all,.slist[data-scope="all"] .only-proj{display:none !important}
  .sl-head{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 10px}
  .sl-proj{display:flex;align-items:center;gap:8px;min-width:0;height:40px;padding:0 8px 0 6px;border-radius:var(--r-md);cursor:pointer}
  .sl-proj:hover{background:rgb(var(--hover))}
  .sl-proj .nm{display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .sl-proj b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sl-proj small{font-size:11.5px;color:rgb(var(--content-3));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sl-proj .caret{color:rgb(var(--content-3))}
  .new-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 9px;border:0;border-radius:var(--r-md);background:rgb(var(--content));color:rgb(var(--surface));font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:var(--e1);transition:opacity var(--dur-1) var(--ease)}
  .new-btn:hover{opacity:.86}
  .sl-tools{flex:none;display:flex;flex-direction:column;gap:10px;padding:2px 12px 10px;border-bottom:1px solid rgb(var(--edge))}
  .sl-search{display:flex;align-items:center;gap:7px;height:32px;padding:0 7px 0 10px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface));color:rgb(var(--content-3));font-size:12.5px;cursor:text}
  .sl-search .kbd{margin-left:auto}
  .sl-tabs{display:flex;gap:2px;overflow:hidden}
  .sl-tab{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border:0;border-radius:6px;background:transparent;font-size:12px;color:rgb(var(--content-3));cursor:pointer}
  .sl-tab:hover{color:rgb(var(--content))}
  .sl-tab.on{background:rgb(var(--active));color:rgb(var(--content));font-weight:500}
  .sl-tab em{font-style:normal;font-size:11px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .sl-scroll{flex:1;min-height:0;overflow:auto;padding:0 8px 8px}
  .sl-group{display:flex;align-items:center;gap:6px;padding:14px 10px 6px;font-size:11.5px;font-weight:600;color:rgb(var(--content-3))}
  .srow{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:10px;row-gap:3px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .srow+.srow{margin-top:1px}
  .srow:hover{background:rgb(var(--hover))}
  .srow>.pv{grid-row:1 / span 2;align-self:start;margin-top:1px}
  .srow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:rgb(var(--content-2))}
  .srow .tm{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums;white-space:nowrap}
  .srow .tm .dot{width:6px;height:6px}
  .srow .tm.run{color:rgb(var(--accent-strong));font-weight:600}
  .srow .tm .spin{width:10px;height:10px}
  .srow .sub{grid-column:2 / 4;display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:rgb(var(--content-3));white-space:nowrap;overflow:hidden}
  .srow .sub .ic{flex:none}
  .srow .sub .nt{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .srow .sub .warn{color:rgb(var(--warning))}
  .srow .sub .bad{color:rgb(var(--danger))}
  .srow .sub .hi{color:rgb(var(--content-2))}
  .srow .prog{grid-column:2 / 4;height:3px;margin-top:5px;border-radius:999px;background:rgb(var(--edge-strong) / .6);overflow:hidden}
  .srow .prog i{display:block;height:100%;border-radius:inherit;background:rgb(var(--accent))}
  .srow.active{background:rgb(var(--surface));box-shadow:var(--e1),inset 0 0 0 1px rgb(var(--edge))}
  [data-theme="dark"] .srow.active{background:rgb(var(--active));box-shadow:none}
  .srow.active .t,.srow.unread .t{color:rgb(var(--content));font-weight:500}
  /* 按项目:进行中 / 置顶 / 按分支与工作树分组,每组可折叠 */
  .sg{margin-top:8px}
  .sg:first-child{margin-top:4px}
  .sg-h{display:flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 6px;border-radius:8px;font-size:12px;color:rgb(var(--content-3));cursor:pointer;user-select:none;white-space:nowrap}
  .sg-h:hover{background:rgb(var(--hover));color:rgb(var(--content-2))}
  .sg-h .chev{flex:none;transition:transform var(--dur-2) var(--ease)}
  .sg.closed .sg-h .chev{transform:rotate(-90deg)}
  .sg.closed .sg-b{display:none}
  .sg-h .gi{flex:none;color:rgb(var(--content-3))}
  .sg-h .nm{flex:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:rgb(var(--content-2))}
  .sg-h .nm.mono{font-size:12px}
  .sg-h em{font-style:normal;font-size:11px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .sg-h .hint{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:rgb(var(--content-3))}
  .sg-h .hint.ok{color:rgb(var(--success))}
  .sg-h .wt-tag{flex:none;height:18px;padding:0 6px;border-radius:5px;background:rgb(var(--warning) / .12);color:rgb(var(--warning));font-size:11px;font-weight:500;line-height:18px}
  .sg-h .acts{margin-left:auto;display:flex;gap:1px;opacity:0;transition:opacity var(--dur-1) var(--ease)}
  .sg-h:hover .acts{opacity:1}
  .sg-h .acts .icon-btn{width:22px;height:22px}
  .sg.attn .sg-h .gi{color:rgb(var(--warning))}
  .sg.attn .sg-b{padding:2px 0 2px;border-radius:12px;background:rgb(var(--warning) / .045);box-shadow:inset 0 0 0 1px rgb(var(--warning) / .12)}
  .sg.attn .sg-b .srow.active{margin:0 2px}
  .sg.tree .sg-b{position:relative;padding-left:12px}
  .sg.tree .sg-b::before{content:"";position:absolute;left:12px;top:2px;bottom:8px;width:1px;background:rgb(var(--edge-strong) / .8)}
  .sg.tree .sg-b .sl-more{padding-left:44px}
  /* 行内状态标签:等你处理 = 琥珀,出错 = 红 */
  .srow .tm.warn,.srow .tm.bad{height:18px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600}
  .srow .tm.warn{background:rgb(var(--warning) / .13);color:rgb(var(--warning))}
  .srow .tm.bad{background:rgb(var(--danger) / .11);color:rgb(var(--danger))}
  /* 悬停时右侧时间换成归档按钮(运行中的会话不给归档) */
  .srow .arch{position:absolute;top:7px;right:7px;width:24px;height:24px;display:none;place-items:center;border-radius:6px;background:rgb(var(--surface));box-shadow:var(--e1),inset 0 0 0 1px rgb(var(--edge));color:rgb(var(--content-3));cursor:pointer}
  .srow .arch:hover{color:rgb(var(--content));background:rgb(var(--surface-2))}
  .srow:hover .arch,.srow.hov .arch{display:grid}
  .srow:hover:has(.arch) .tm,.srow.hov .tm{visibility:hidden}
  .srow.hov{background:rgb(var(--hover))}
  /* 等你处理提醒条 */
  .attn-bar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 9px;border-radius:10px;background:rgb(var(--warning) / .08);box-shadow:inset 0 0 0 1px rgb(var(--warning) / .2);cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .attn-bar:hover{background:rgb(var(--warning) / .13)}
  .slist[data-scope="proj"] .attn-bar.only-all,.slist[data-scope="all"] .attn-bar.only-proj{display:none}
  .ab-ico{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;background:rgb(var(--warning) / .15);color:rgb(var(--warning))}
  .ab-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .ab-txt b{font-size:12.5px;font-weight:600;color:rgb(var(--content))}
  .ab-txt span{font-size:11.5px;color:rgb(var(--content-3));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attn-bar .kbd{flex:none}
  /* 项目栏:等你处理的数量 */
  .rail .cnt{position:absolute;right:-2px;bottom:-2px;min-width:15px;height:15px;padding:0 3.5px;border-radius:999px;background:rgb(var(--warning));color:#fff;font-size:9.5px;font-weight:700;font-style:normal;line-height:15px;text-align:center;box-shadow:0 0 0 2px rgb(var(--rail))}
  .rail-btn.on .cnt{box-shadow:0 0 0 2px rgb(var(--surface))}
  [data-theme="dark"] .rail .cnt{color:#1c1305}
  .sb-i.warn{color:rgb(var(--warning))}
  .sb-i.warn b{color:rgb(var(--warning))}
  .srow .sub .ic.warn{color:rgb(var(--warning))}
  .srow .sub .ic.bad{color:rgb(var(--danger))}
  .srow .racts{position:absolute;top:6px;right:6px;display:none;gap:1px;padding:1px;border-radius:7px;background:rgb(var(--surface));box-shadow:var(--e1),inset 0 0 0 1px rgb(var(--edge))}
  .srow .racts .icon-btn{width:22px;height:22px}
  .srow:hover .racts,.srow.hov .racts{display:flex}
  .srow.hov{background:rgb(var(--hover))}
  .sl-more{display:flex;align-items:center;gap:6px;height:32px;padding-left:42px;font-size:12px;color:rgb(var(--content-3))}
  .sl-more:hover{color:rgb(var(--content))}
  .sl-foot{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 18px;border-top:1px solid rgb(var(--edge));font-size:12px;color:rgb(var(--content-3))}
  .sl-foot a{display:inline-flex;align-items:center;gap:6px}
  .sl-foot a:hover{color:rgb(var(--content))}

  .pv{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
  .pv.cl{background:rgb(217 119 87 / .13);color:#d97757}
  /* Codex:OpenAI 官方单色标志,中性底;Pi:官方方块 π 标志,用应用里 Pi 的品牌紫 #A78BFA */
  .pv.cx{background:rgb(var(--content) / .075);color:rgb(var(--content))}
  .pv.pi{background:rgb(139 92 246 / .13);color:rgb(124 58 237)}
  [data-theme="dark"] .pv.pi{background:rgb(167 139 250 / .16);color:rgb(196 181 253)}
  [data-theme="dark"] .pv.cx{background:rgb(255 255 255 / .09)}
  .pv .ic.fill{fill:currentColor;stroke:none}
  /* Claude:Simple Icons 的官方标志(与应用里 react-icons 的 SiClaude 同源),用 mask 着色,跟随 currentColor */
  .cmark{display:inline-block;width:14px;height:14px;flex:none;background:currentColor;-webkit-mask:var(--claude-svg) center/contain no-repeat;mask:var(--claude-svg) center/contain no-repeat}
  .cmark.sm{width:13px;height:13px}
  .pv.cl .cmark{width:13px;height:13px}
  .ai-mark .cmark{width:13px;height:13px}
  .cmark.claude{color:#d97757}
