NC4xMjE0IDEuMDgwNy0uMTcuMzUyMS0uNjA3MS4yMTI1LS42Njc5LS4xMjE0LTEuMzcyMS0xLjkyNDZMMTQuMzggMTcuOTU5bC0xLjE0MTQtMS45NDI4LS4xMzk3LjA3OS0uNjc0IDcuMjU1Mi0uMzE1Ni4zNzAzLS43Mjg2LjI3OTMtLjYwNzEtLjQ2MTQtLjMyMTgtLjc0NjguMzIxOC0xLjQ3NTMuMzg4Ni0xLjkyNDYuMzE1Ny0xLjUzLjI4NTMtMS45MDA0LjE3LS42MzE0LS4wMTIxLS4wNDI1LS4xMzk3LjAxODItMS40MzI4IDEuOTY3Mi0yLjE3OTYgMi45NDQ2LTEuNzI0MyAxLjg0NTYtLjQxMjguMTY0LS43MTY0LS4zNzA0LjA2NjctLjY2MTguNDAwOC0uNTg4OSAyLjM4Ni0zLjAzNTcgMS40Mzg5LTEuODgyLjkyOS0xLjA4NjgtLjAwNjItLjE1NzloLS4wNTQ2bC02LjMzODUgNC4xMTY0LTEuMTI5My4xNDU3LS40ODU3LS40NTU0LjA2MDgtLjc0NjcuMjMwNy0uMjQyOSAxLjkwNjQtMS4zMTE0WiIvPjwvc3ZnPg==")}
  .pv.cx .ic.fill{width:13px;height:13px}
  .pv.pi .ic.fill{width:15px;height:15px}
  .pv .ic{width:13px;height:13px}
  .av-mini{--av:104 114 150;width:14px;height:14px;flex:none;border-radius:4px;display:inline-grid;place-items:center;background:rgb(var(--av) / .16);color:rgb(var(--av));font-size:9px;font-weight:700;line-height:1}

  /* ---------- ③ 主区 ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:rgb(var(--surface))}
  .topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding-left:22px;border-bottom:1px solid rgb(var(--edge));user-select:none}
  .tb-title{display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .tb-title b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-title small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgb(var(--content-3));white-space:nowrap}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
  .topbar .winctl{height:52px;margin-left:8px}
  .content{flex:1;min-height:0;display:flex}
  .chat-area{flex:1;min-width:0;display:flex;flex-direction:column}
  .chat-area .chat-col{padding:64px 32px 32px}
  .chat-area .composer-wrap{padding:0 28px 16px}

  /* 右侧面板收起:宽度 320 → 0 滑出,内容固定 320px 宽不重排,只跟着一起淡出;收起稍快、展开稍慢 */
  .panel{width:320px;flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:rgb(var(--sl));border-left:1px solid rgb(var(--edge));transition:width 320ms cubic-bezier(.2,.9,.25,1),border-color 320ms var(--ease)}
  .panel>.pane{width:320px;flex:1 0 auto;transition:opacity 220ms var(--ease) 60ms,transform 320ms cubic-bezier(.2,.9,.25,1)}
  .app.no-panel .panel{width:0;border-left-color:transparent;transition-duration:240ms;transition-timing-function:cubic-bezier(.4,0,.2,1)}
  .app.no-panel .panel>.pane{opacity:0;transform:translateX(24px);transition:opacity 120ms var(--ease),transform 240ms cubic-bezier(.4,0,.2,1)}
  .app[data-view="welcome"] .panel{display:none}
  @keyframes paneIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
  .panel-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid rgb(var(--edge))}
  .panel-head b{font-size:13px;font-weight:600}
  .panel-head .muted{font-size:12px}
  .panel-head .tools{margin-left:auto;display:flex;gap:2px}
  .pane{display:none;flex:1;min-height:0;flex-direction:column}
  .pane.on{display:flex}
  .app.pane-switch .pane.on{animation:paneIn 200ms var(--ease)}
  .pane-scroll{flex:1;min-height:0;overflow:auto}
  .strip{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:rgb(var(--sl));border-left:1px solid rgb(var(--edge))}
  .strip-btn{position:relative;width:34px;height:34px;flex:none;border:0;border-radius:9px;display:grid;place-items:center;background:transparent;color:rgb(var(--content-3));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .strip-btn:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .strip-btn.on{background:rgb(var(--active));color:rgb(var(--content))}
  .app.no-panel .strip-btn.on{background:transparent;color:rgb(var(--content-3))}
  .strip-btn .ic{width:18px;height:18px}
  .strip-btn .badge{position:absolute;top:0;right:-2px;background:rgb(var(--accent));color:rgb(var(--on-accent));box-shadow:0 0 0 2px rgb(var(--sl))}
  .strip-sep{width:20px;height:1px;flex:none;margin:4px 0;background:rgb(var(--edge))}
  .strip-grow{flex:1}

  /* Git */
  .g-block{padding:12px 14px;border-bottom:1px solid rgb(var(--edge))}
  .g-branch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgb(var(--content-3))}
  .g-branch b{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:rgb(var(--content))}
  .g-branch .btn{margin-left:auto}
  .g-msg{display:block;width:100%;height:64px;margin-top:10px;padding:8px 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));resize:none;outline:none;font:inherit;font-size:12.5px;line-height:1.5;color:rgb(var(--content))}
  .g-msg::placeholder{color:rgb(var(--content-3))}
  .g-msg:focus{border-color:rgb(var(--accent) / .6);box-shadow:0 0 0 3px rgb(var(--accent) / .12)}
  .g-actions{display:flex;gap:6px;margin-top:8px}
  .g-actions .btn-primary{flex:1;justify-content:center}
  .g-sec{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 14px;font-size:11.5px;font-weight:600;color:rgb(var(--content-3))}
  .g-sec .tools{margin-left:auto;display:flex}
  .g-file{display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;font-size:12.5px;cursor:pointer}
  .g-file:hover{background:rgb(var(--hover))}
  .g-file .git{margin-left:0;flex:none}
  .g-file b{font-weight:500;white-space:nowrap}
  .g-file .dir{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:rgb(var(--content-3))}
  .g-file .n{margin-left:auto;display:flex;gap:6px;font-family:var(--font-mono);font-size:11px;white-space:nowrap}
  .g-log{padding:2px 14px 12px}
  .commit{position:relative;display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:10px;padding:6px 0}
  .commit::before{content:"";position:absolute;left:6px;top:20px;bottom:-8px;width:1.5px;background:rgb(var(--edge-strong))}
  .commit:last-child::before{display:none}
  .commit>i{width:10px;height:10px;margin:4px 0 0 2px;border-radius:50%;border:2px solid rgb(var(--content-3));background:rgb(var(--sl))}
  .commit.head>i{border-color:rgb(var(--accent));background:rgb(var(--accent))}
  .commit b{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .commit .d{grid-column:2 / 4;font-size:11.5px;color:rgb(var(--content-3))}
  .commit em{grid-row:1;grid-column:3;font-style:normal;font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}

  /* 本会话 */
  .o-sec{padding:14px 14px 12px;border-bottom:1px solid rgb(var(--edge))}
  .o-sec h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:11.5px;font-weight:600;color:rgb(var(--content-3))}
  .o-sec h4 .mini{margin-left:auto}
  .task{display:flex;align-items:flex-start;gap:9px;padding:4px 0;font-size:12.5px;line-height:1.5;color:rgb(var(--content-2))}
  .task .st{width:16px;height:16px;flex:none;margin-top:1px;display:grid;place-items:center}
  .task.done{color:rgb(var(--content-3))}
  .task.done .t{text-decoration:line-through;text-decoration-color:rgb(var(--content-3) / .45)}
  .task.done .st{color:rgb(var(--accent-strong))}
  .task.now{color:rgb(var(--content));font-weight:500}
  .task .circ{width:12px;height:12px;border-radius:50%;border:1.5px solid rgb(var(--edge-strong))}
  .toc-i{display:flex;align-items:center;gap:8px;height:28px;margin:0 -8px;padding:0 8px;border-radius:6px;font-size:12.5px;color:rgb(var(--content-2));cursor:pointer}
  .toc-i:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .toc-i.sub{padding-left:30px;color:rgb(var(--content-3))}
  .toc-i .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toc-i .tm{margin-left:auto;font-size:11px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .kv{display:grid;grid-template-columns:1fr auto;row-gap:7px;font-size:12.5px;color:rgb(var(--content-3))}
  .kv b{font-weight:500;color:rgb(var(--content));text-align:right;font-variant-numeric:tabular-nums}
  .meter{grid-column:1 / 3;height:6px;margin:0 0 3px;border-radius:999px;background:rgb(var(--edge-strong) / .6);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:inherit;background:rgb(var(--accent))}

  /* 浏览器 / 终端 */
  .b-url{display:flex;align-items:center;gap:6px;height:30px;margin:10px;padding:0 10px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface));font-size:12px;color:rgb(var(--content-2))}
  .b-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0 10px 10px;padding:20px;border:1px dashed rgb(var(--edge-strong));border-radius:var(--r-lg);text-align:center;font-size:12.5px;line-height:1.55;color:rgb(var(--content-3))}
  .term{flex:1;margin:10px;padding:10px 12px;border-radius:var(--r-lg);background:#101012;color:#d6d6d0;font-family:var(--font-mono);font-size:11.5px;line-height:1.75;overflow:auto;white-space:pre}
  .term .p{color:#34d399}
  .term .e{color:#f87171}
  .term .m{color:#8a8a84}

  /* ---------- 本会话浮窗(借鉴 Codex:悬浮在会话区右上角,可折叠成一枚胶囊) ---------- */
  .chat-area{position:relative}
  /* 待确认卡片(审批 / 计划 / 提问)永远压在「本会话」浮窗之上,避免被遮住 */
  .chat-area .composer-wrap{z-index:8}
  /* 动画思路:卡片尺寸与内部排版永远不变(300px 宽、高度按内容),折叠 / 展开只动 clip-path ——
   * 从右上角的胶囊大小「剪开」成整张卡片,外加内容的 opacity / transform。全程不触发重排、不重新换行;
   * 去掉了 backdrop-filter(每帧重算模糊是之前卡顿的主因之一)。
   * 阴影和发丝边用外层的 filter: drop-shadow —— 它作用在裁剪之后的形状上,胶囊和卡片都有正确的描边与投影。
   * --pill-w 由脚本按摘要文字实际宽度测量;展开 380ms(ease-out-quint),折叠 260ms(稍快、先收内容再收外形)。 */
  .fsess{--pill-w:300px;--pill-h:36px;--fs-in:380ms cubic-bezier(.22,1,.36,1);--fs-out:260ms cubic-bezier(.5,0,.2,1);position:absolute;top:14px;right:16px;z-index:6;width:300px;max-height:calc(100% - 150px);display:flex;pointer-events:none;filter:drop-shadow(0 0 .5px rgb(24 24 22 / .35)) drop-shadow(0 12px 24px rgb(24 24 22 / .14))}
  [data-theme="dark"] .fsess{filter:drop-shadow(0 0 .5px rgb(255 255 255 / .28)) drop-shadow(0 14px 28px rgb(0 0 0 / .55))}
  .fs-card{flex:1;min-height:0;display:flex;flex-direction:column;background:rgb(var(--surface));pointer-events:auto;clip-path:inset(0 0 0 0 round 14px);transition:clip-path var(--fs-in);will-change:clip-path}
  .fsess.folded .fs-card{clip-path:inset(0 0 calc(100% - var(--pill-h)) calc(100% - var(--pill-w)) round 18px);transition:clip-path var(--fs-out) 40ms}
  .fs-head{height:var(--pill-h);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:12.5px;color:rgb(var(--content-2));cursor:pointer;user-select:none;white-space:nowrap;transition:background-color var(--dur-1) var(--ease)}
  .fs-head:hover{background:rgb(var(--hover) / .7)}
  .fs-head:active{background:rgb(var(--active) / .8)}
  .fs-head b{font-weight:600;color:rgb(var(--content))}
  .fs-head .num{font-variant-numeric:tabular-nums}
  .fs-head .chev{flex:none;color:rgb(var(--content-3));transition:transform var(--fs-in)}
  .fsess.folded .fs-head .chev{transform:rotate(180deg);transition:transform var(--fs-out)}
  .fs-swap{flex:1;min-width:0;display:grid;align-items:center}
  .fs-swap>*{grid-area:1/1}
  .fs-title{justify-self:start;display:inline-flex;align-items:center;gap:8px;transition:opacity 160ms var(--ease) 80ms,transform var(--fs-in)}
  .fs-sum{justify-self:end;display:inline-flex;align-items:center;gap:8px;opacity:0;transform:translateX(6px);transition:opacity 120ms var(--ease),transform var(--fs-in)}
  .fsess.folded .fs-title{opacity:0;transform:translateX(-6px);transition:opacity 100ms var(--ease),transform var(--fs-out)}
  .fsess.folded .fs-sum{opacity:1;transform:none;transition:opacity 180ms var(--ease) 90ms,transform var(--fs-out) 40ms}
  .fs-body{flex:1 1 auto;min-height:0;overflow:auto;border-top:1px solid rgb(var(--edge));transition:opacity 220ms var(--ease) 90ms,transform var(--fs-in)}
  .fsess.folded .fs-body{opacity:0;transform:translateY(-8px);transition:opacity 110ms var(--ease),transform var(--fs-out)}
  .app.preload *,.app.preload *::before,.app.preload *::after{transition:none !important}
  .fs-inner .o-sec{padding:12px 14px 10px}
  .fs-inner .o-sec:last-child{border-bottom:0}

  /* ---------- ④ 状态栏 ---------- */
  .statusbar{height:28px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-top:1px solid rgb(var(--edge));background:rgb(var(--rail));font-size:11.5px;color:rgb(var(--content-3));user-select:none}
  .sb-i{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;white-space:nowrap;cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .sb-i:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .sb-i .ic{width:12px;height:12px}
  .sb-i .dot{width:6px;height:6px}
  .sb-i .spin{width:10px;height:10px}
  .sb-i b{font-weight:500;color:rgb(var(--content-2))}
  .sb-sp{flex:1}
  .statusbar .vsep{height:12px;margin:0 3px}

  /* ---------- 欢迎页 ---------- */
  .wl3{flex:1;min-height:0;overflow:auto;padding:52px 48px 40px}
  .wl3-in{max-width:900px;margin:0 auto}
  .wl3-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;margin-top:28px;align-items:start}
  .wl3-col{display:flex;flex-direction:column;gap:16px}
  .wcard{border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface));overflow:hidden}
  .wcard-h{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-bottom:1px solid rgb(var(--edge));background:rgb(var(--surface-2));font-size:12.5px;font-weight:600}
  .wcard-h .ic{color:rgb(var(--content-3))}
  .wcard-h a{margin-left:auto;font-size:12px;font-weight:400;color:rgb(var(--content-3))}
  .wcard-h a:hover{color:rgb(var(--content))}
  .wrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:12px;row-gap:1px;align-items:center;padding:10px 14px;cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .wrow+.wrow{border-top:1px solid rgb(var(--edge) / .8)}
  .wrow:hover{background:rgb(var(--hover) / .7)}
  .wrow>.pv,.wrow>.qi{grid-row:1 / span 2}
  .wrow>b{min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow>.d{grid-column:2;display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:rgb(var(--content-3));white-space:nowrap;overflow:hidden}
  .wrow>.r{grid-row:1 / span 2;grid-column:3;font-size:11.5px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums;white-space:nowrap}
  .qi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgb(var(--hover));color:rgb(var(--content-2))}
  .qi .ic{width:13px;height:13px}

  /* ---------- ⑤ 设置浮层 ---------- */
  .modal-root{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:44px}
  .scrim{position:absolute;inset:0;background:rgb(20 20 18 / .34)}
  [data-theme="dark"] .scrim{background:rgb(0 0 0 / .6)}
  .sheet{position:relative;width:min(1100px,100%);height:min(740px,100%);display:flex;border:1px solid rgb(var(--edge));border-radius:16px;background:rgb(var(--surface));box-shadow:var(--e3);overflow:hidden;animation:rise var(--dur-2) var(--ease)}
  .sheet-nav{width:236px;flex:none;display:flex;flex-direction:column;min-height:0;padding:16px 10px 10px;background:rgb(var(--sl));border-right:1px solid rgb(var(--edge))}
  .sheet-nav h2{display:flex;align-items:center;gap:8px;margin:0 6px 4px;font-size:15px;font-weight:600}
  .sheet-nav .set-search{margin-top:10px}
  .sheet-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .sheet-head{display:flex;align-items:flex-start;gap:8px;padding:24px 16px 0 32px}
  .sheet-head .txt{flex:1;min-width:0}
  .sheet-tabs{display:flex;gap:22px;margin-top:18px;padding:0 32px;border-bottom:1px solid rgb(var(--edge))}
  .stab{position:relative;height:38px;padding:0;border:0;background:transparent;font-size:13px;color:rgb(var(--content-3));cursor:pointer}
  .stab:hover{color:rgb(var(--content))}
  .stab.on{color:rgb(var(--content));font-weight:600}
  .stab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:rgb(var(--content))}
  .sheet-scroll{position:relative;flex:1;min-height:0;overflow:auto;padding:24px 32px 32px}
  .sheet-scroll .set-sec,.sheet-scroll .set-foot{max-width:720px}
  .sheet-foot{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 0 32px;border-top:1px solid rgb(var(--edge));background:rgb(var(--surface-2))}
</style>
</head>

          <tr><td>聊天正文宽度</td><td>1024px</td><td>760px</td><td>760px（代码块带行号和增删标记）</td></tr>
          <tr><td>设置页</td><td>—</td><td>单列居中，右侧大片留白</td><td>主题缩略图、字号实时预览、右侧「本页」目录</td></tr>
          <tr><td>背景模糊</td><td>11 处</td><td>不新增</td><td>不新增，逐步去掉滚动区里的</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
</template>

<script>
  const SWATCHES = [
    ["--bg", "窗口底色"], ["--surface", "主区"], ["--surface-2", "内衬"], ["--hover", "悬停"], ["--active", "选中"],
    ["--edge", "分隔线"], ["--edge-strong", "描边"], ["--content", "正文"], ["--content-2", "次要文字"], ["--content-3", "辅助文字"],
    ["--accent", "翡翠绿"], ["--accent-strong", "翡翠绿文字"], ["--danger", "危险"], ["--warning", "警告"], ["--info", "信息"],
  ];
  const ACCENTS = {
    mint: null, // 默认 = 图标色(主题 token 本身)
    emerald: { light: ["5 150 105", "4 120 87"], dark: ["16 185 129", "52 211 153", "3 30 21"] },
    sky: { light: ["2 132 199", "3 105 161"], dark: ["14 165 233", "56 189 248", "8 25 40"] },
    indigo: { light: ["79 70 229", "67 56 202"], dark: ["99 102 241", "129 140 248"] },
    violet: { light: ["124 58 237", "109 40 217"], dark: ["139 92 246", "167 139 250"] },
    rose: { light: ["225 29 72", "190 18 60"], dark: ["244 63 94", "251 113 133"] },
    amber: { light: ["217 119 6", "180 83 9"], dark: ["245 158 11", "251 191 36", "40 22 2"] },
    gray: { light: ["82 82 91", "63 63 70"], dark: ["161 161 170", "212 212 216", "18 18 20"] },
  };
  const PANES = ["files", "git", "browser", "term"];
  const state = { view: "chat", theme: "light", prompt: "none", scope: "proj", pane: "files", panel: true, fold: "open" };
  for (const tok of location.hash.slice(1).split(/[&,]/)) {
    if (["chat", "welcome", "settings", "spec"].includes(tok)) state.view = tok;
    if (["light", "dark", "both"].includes(tok)) state.theme = tok;
    if (["approve", "plan", "ask"].includes(tok)) state.prompt = tok;
    if (tok === "all" || tok === "proj") state.scope = tok;
    if (PANES.includes(tok)) state.pane = tok;
    if (tok === "nopanel") state.panel = false;
    if (tok === "fold") state.fold = "fold";
    if (tok === "imgs") state.imgs = true;
  }
  const stage = document.getElementById("stage");

  function hex(t) { return "#" + t.trim().split(/\s+/).map((n) => Number(n).toString(16).padStart(2, "0")).join("").toUpperCase(); }

  function fillSwatches(root) {
    const box = root.querySelector("[data-swatches]");
    if (!box) return;
    const cs = getComputedStyle(root);
    box.innerHTML = SWATCHES.map(([name, label]) => {
      const v = cs.getPropertyValue(name).trim();
      return `<div class="sw"><i style="background:rgb(${v})"></i><div><b>${label}</b><span>${name}</span><span>${hex(v)}</span></div></div>`;
    }).join("");
  }

  // 胶囊宽度 = 从摘要文字左缘到卡片右缘 + 左侧留白;摘要一直在排版里(只是透明),随时可量
  function measurePill(fs) {
    const sum = fs.querySelector(".fs-sum");
    if (!sum) return;
    const w = Math.ceil(fs.offsetWidth - sum.offsetLeft + 12);
    fs.style.setProperty("--pill-w", Math.min(w, fs.offsetWidth) + "px");
  }

  function applyLayout(app) {
    const sl = app.querySelector(".slist");
    if (!sl) return;
    sl.dataset.scope = state.scope;
    app.querySelectorAll(".rail-btn[data-scope]").forEach((b, i) => {
      const on = state.scope === "all" ? b.dataset.scope === "all" : (b.dataset.scope === "proj");
      b.classList.toggle("on", on);
    });
    app.classList.toggle("no-panel", !state.panel);
    app.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.dataset.pane === state.pane));
    app.querySelectorAll(".strip-btn[data-pane]").forEach((b) => b.classList.toggle("on", b.dataset.pane === state.pane));
    app.querySelector('[data-act="panel"]')?.classList.toggle("on", state.panel);
    const fs = app.querySelector("[data-fsess]");
    if (fs) { measurePill(fs); fs.classList.toggle("folded", state.fold === "fold"); }
  }

  function wire(root) {
    root.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", () => {
      const app = el.closest(".app");
      const act = el.dataset.act;
      if (act === "theme") { app.dataset.theme = app.dataset.theme === "dark" ? "light" : "dark"; delete app.dataset.themePref; syncTheme(app); }
      if (act === "settings") go("settings");
      if (act === "close") go("chat");
      if (act === "panel") { state.panel = !state.panel; applyLayout(app); saveHash(); }
      if (act === "fsess-open") { state.fold = "open"; document.querySelectorAll(".app").forEach(applyLayout); markPressed(); saveHash(); }
      if (act === "fsess") { state.fold = state.fold === "fold" ? "open" : "fold"; document.querySelectorAll(".app").forEach(applyLayout); markPressed(); saveHash(); }
      if (act === "steps") el.closest(".steps").classList.toggle("collapsed");
      if (act === "detail") el.closest(".dock").classList.toggle("open");
      if (act === "check") el.classList.toggle("on");
      if (act === "resolve") { state.prompt = "none"; document.querySelectorAll(".app").forEach((a) => { a.dataset.prompt = "none"; }); markPressed(); saveHash(); }
    }));
    root.querySelectorAll(".rail-btn[data-scope]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.scope === "other") return;
      state.scope = b.dataset.scope;
      document.querySelectorAll(".app").forEach(applyLayout);
      saveHash();
    }));
    root.querySelectorAll(".strip-btn[data-pane]").forEach((b) => b.addEventListener("click", () => {
      if (state.pane === b.dataset.pane && state.panel) state.panel = false;
      else {
        // 面板开着时切页签才做页签淡入;从收起状态打开时只做面板滑出,不叠两层动画
        document.querySelectorAll(".app").forEach((a) => a.classList.toggle("pane-switch", state.panel));
        state.pane = b.dataset.pane; state.panel = true;
      }
      document.querySelectorAll(".app").forEach(applyLayout);
      markPressed(); saveHash();
    }));
    root.querySelectorAll(".fchip").forEach((c) => {
      c.addEventListener("click", () => {
        root.querySelectorAll(".fchip.sel").forEach((x) => x !== c && x.classList.remove("sel"));
        c.classList.toggle("sel");
      });
      c.addEventListener("dblclick", () => {
        c.classList.remove("opening"); void c.offsetWidth; c.classList.add("opening");
      });
    });
    root.querySelectorAll(".sg-h").forEach((h) => h.addEventListener("click", (e) => {
      if (!e.target.closest(".acts")) h.parentElement.classList.toggle("closed");
    }));
    root.querySelectorAll("[data-sltabs] .sl-tab").forEach((t) => t.addEventListener("click", () => {
      t.parentElement.querySelectorAll(".sl-tab").forEach((x) => x.classList.toggle("on", x === t));
    }));
    root.querySelectorAll(".segctl").forEach((seg) => seg.addEventListener("click", (e) => {
      const t = e.target.closest("button");
      if (t) seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === t));
    }));
    root.querySelectorAll("[data-themectl] .tile").forEach((tile) => tile.addEventListener("click", () => {
      const app = tile.closest(".app");
      const pref = tile.dataset.t;
      app.dataset.themePref = pref;
      app.dataset.theme = pref === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
      syncTheme(app);
    }));
    root.querySelectorAll("[data-accents] .swc").forEach((sw) => sw.addEventListener("click", () => {
      const app = sw.closest(".app");
      sw.parentElement.querySelectorAll(".swc").forEach((b) => b.classList.toggle("on", b === sw));
      app.dataset.accent = sw.dataset.accent;
      applyAccent(app);
    }));
    root.querySelectorAll("[data-step]").forEach((st) => {
      const [dec, inc] = st.querySelectorAll("button");
      const update = (d) => {
        const v = Math.min(20, Math.max(11, Number(st.dataset.val) + d));
        st.dataset.val = String(v);
        st.querySelector("span").textContent = v + " px";
        const pv = st.closest(".set-box").querySelector("[data-preview]");
        if (pv) pv.style.setProperty(st.dataset.step === "ui" ? "--pv-ui" : "--pv-chat", v + "px");
      };
      dec.addEventListener("click", () => update(-1));
      inc.addEventListener("click", () => update(1));
    });
    root.querySelectorAll("[data-stabs] .stab").forEach((t) => t.addEventListener("click", () => {
      t.parentElement.querySelectorAll(".stab").forEach((x) => x.classList.toggle("on", x === t));
      const sec = t.closest(".sheet").querySelector("#" + t.dataset.sec);
      const box = t.closest(".sheet").querySelector(".sheet-scroll");
      if (sec && box) box.scrollTo({ top: sec.offsetTop - 24, behavior: "smooth" });
    }));
    root.querySelectorAll(".opts").forEach((box) => box.addEventListener("click", (e) => {
      const opt = e.target.closest(".opt");
      if (opt) box.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o === opt));
    }));
  }

  function applyAccent(app) {
    ["--accent", "--accent-strong", "--on-accent", "--primary", "--primary-hover", "--on-primary"].forEach((p) => app.style.removeProperty(p));
    const pick = ACCENTS[app.dataset.accent];
    if (!pick) return; // 图标色:主按钮保持深石墨(深色下薄荷)
    const [a, s, on = "255 255 255"] = pick[app.dataset.theme === "dark" ? "dark" : "light"];
    app.style.setProperty("--accent", a);
    app.style.setProperty("--accent-strong", s);
    app.style.setProperty("--on-accent", on);
    // 选了其它强调色时,主按钮也跟着换成该色
    app.style.setProperty("--primary", a);
    app.style.setProperty("--primary-hover", s);
    app.style.setProperty("--on-primary", on);
  }

  function syncTheme(app) {
    applyAccent(app);
    const pref = app.dataset.themePref || app.dataset.theme;
    app.querySelectorAll("[data-themectl] .tile").forEach((b) => b.classList.toggle("on", b.dataset.t === pref));
    const cur = app.querySelector('[data-t="system"] .tile-lbl span');
    if (cur) cur.textContent = "当前：" + (app.dataset.theme === "dark" ? "深色" : "浅色");
  }

  function markPressed() {
    document.querySelectorAll(".pseg").forEach((g) => g.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(state[g.dataset.group] === b.dataset.v));
    }));
  }

  function saveHash() {
    const parts = [state.view, state.theme];
    if (state.prompt !== "none") parts.push(state.prompt);
    if (state.scope === "all") parts.push("all");
    if (state.pane !== "files") parts.push(state.pane);
    if (state.fold === "fold") parts.push("fold");
    if (!state.panel) parts.push("nopanel");
    history.replaceState(null, "", "#" + parts.join("&"));
  }

  function go(view) { state.view = view; saveHash(); render(); }

  function fit() {
    if (state.theme !== "both") return;
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    stage.style.setProperty("--z", Math.max(0.3, Math.min((w - 20) / 2560, h / 800)).toFixed(3));
  }

  function render() {
    markPressed();
    stage.className = "stage " + (state.theme === "both" ? "both" : "single");
    stage.innerHTML = "";
    const themes = state.theme === "both" ? ["light", "dark"] : [state.theme];
    for (const theme of themes) {
      const frame = document.createElement("div");
      frame.className = "frame";
      const tpl = document.getElementById(state.view === "spec" ? "tpl-spec" : "tpl-app");
      const node = tpl.content.firstElementChild.cloneNode(true);
      node.dataset.theme = theme;
      // 首帧直接落到目标状态,不播过渡;两帧后才开放动画(用户点击时才有)
      node.classList.add("preload");
      requestAnimationFrame(() => requestAnimationFrame(() => node.classList.remove("preload")));
      if (state.view !== "spec") { node.dataset.view = state.view; node.dataset.prompt = state.prompt; }
      frame.appendChild(node);
      stage.appendChild(frame);
      wire(node);
      if (state.view !== "spec") { applyLayout(node); syncTheme(node); }
      // #imgs:直接滚到第二轮(图片与文件路径演示)
      if (state.imgs && state.view === "chat") {
        const target = node.querySelector("#turn-img");
        const box = node.querySelector(".chat-scroll");
        if (target && box) requestAnimationFrame(() => { box.scrollTop = target.offsetTop - 70; });
        // #fpop:演示路径悬停卡常开
        if (location.hash.includes("fpop")) node.querySelector(".fchip-wrap")?.classList.add("demo");
      }
      fillSwatches(node);
    }
    fit();
  }

  document.querySelectorAll(".pseg").forEach((g) => g.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    state[g.dataset.group] = b.dataset.v;
    if (g.dataset.group === "prompt" && b.dataset.v !== "none") state.view = "chat";
    if (g.dataset.group === "pane") { state.panel = true; if (state.view !== "chat") state.view = "chat"; }
    if (g.dataset.group === "fold" && state.view !== "chat") state.view = "chat";
    saveHash();
    render();
  }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.view === "settings") go("chat"); });
  window.addEventListener("resize", fit);
  render();
  document.fonts?.ready.then(() => document.querySelectorAll("[data-fsess]").forEach(measurePill));
</script>
</body>
</html>
