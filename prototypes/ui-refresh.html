<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarioCode · 界面焕新原型（方向 B · 悬浮工作区）</title>
<style>
  /* =========================================================================
   * 界面焕新 · 方向 B「悬浮工作区」交互原型(侧栏结构和字号借鉴 Codex 桌面版)
   *
   * 用法:直接双击在浏览器里打开,或 `node prototypes/.serve.mjs` 后访问
   *   http://127.0.0.1:8899/ui-refresh.html
   * 顶栏切换 视图(会话 / 欢迎页 / 设置 / 设计规范)、待确认卡片(工具审批 /
   * 计划审批 / 提问,停靠在会话输入框上方)与 主题(浅色 / 深色 / 并排)。
   * 地址栏 hash 可直接定位,例如 #dark、#welcome、#settings&dark、#approve、#spec&both。
   *
   * 目标:浅色、深色两套主题都是一等公民;中性色打底,翡翠绿只做点缀。
   * 这里的 token 数值就是之后落到 styles.css / tailwind.config.js 的依据。
   * 只是视觉稿:不接数据,交互只做到能看出形态(主题切换、面板开合、聚焦态)。
   * ========================================================================= */

  /* ===== 通用 token ===== */
  :root{
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,Consolas,monospace;
    --r-sm:6px;   /* 行内代码、徽标、文件树行、菜单项 */
    --r-md:8px;   /* 按钮、输入框、列表行 */
    --r-lg:12px;  /* 卡片、代码块、气泡、弹层 */
    --r-xl:16px;  /* 工作区卡片、输入框卡片 */
    --dur-1:120ms;
    --dur-2:200ms;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  /* ===== 浅色主题(每个值是 "R G B" 三元组,与现有 styles.css 同一约定) ===== */
  [data-theme]{
    --bg:243 244 246;          /* 窗口底色:侧栏、标题栏直接落在上面 */
    --surface:255 255 255;     /* 工作区卡片、弹层 */
    --surface-2:247 248 250;   /* 内衬:代码块、表头、文件卡头 */
    --hover:240 241 244;
    --active:232 234 238;
    --edge:229 231 235;        /* 卡片边、分隔线 */
    --edge-strong:213 216 222; /* 输入框描边 */
    --content:17 19 24;
    --content-2:73 78 89;
    --content-3:124 129 141;
    --accent:5 150 105;        /* 翡翠绿 emerald-600 */
    --accent-strong:4 120 87;  /* 小号绿色文字用 emerald-700,过 4.5:1 */
    --on-accent:255 255 255;
    --danger:220 38 38;
    --warning:180 83 9;
    --info:124 58 237;
    --success:4 120 87;
    --bubble:241 242 245;
    --syn-kw:124 58 237;
    --syn-str:15 118 110;
    --syn-fn:37 99 235;
    --e1:0 1px 2px rgb(16 24 40 / .05);
    --e2:0 6px 16px -6px rgb(16 24 40 / .12), 0 2px 4px -2px rgb(16 24 40 / .05);
    --e3:0 24px 48px -16px rgb(16 24 40 / .24), 0 6px 12px -6px rgb(16 24 40 / .08);
    --w-base:400;
    color-scheme:light;
  }

  /* ===== 深色主题:中性偏冷的近黑,三层明度拉开 ===== */
  [data-theme="dark"]{
    --bg:14 15 17;
    --surface:23 24 27;
    --surface-2:29 31 35;
    --hover:35 37 42;
    --active:43 46 52;
    --edge:39 41 47;
    --edge-strong:55 58 65;
    --content:236 237 240;
    --content-2:172 176 185;
    --content-3:124 129 139;
    --accent:16 185 129;       /* emerald-500 */
    --accent-strong:52 211 153;/* emerald-400 */
    --on-accent:3 30 21;       /* 深色下绿底配深色字,白字对比度只有 2.5:1 */
    --danger:248 113 113;
    --warning:251 191 36;
    --info:167 139 250;
    --success:52 211 153;
    --bubble:36 38 43;
    --syn-kw:196 181 253;
    --syn-str:94 234 212;
    --syn-fn:147 197 253;
    --e1:0 1px 2px rgb(0 0 0 / .35);
    --e2:0 10px 24px -8px rgb(0 0 0 / .55), 0 0 0 1px rgb(255 255 255 / .03);
    --e3:0 28px 56px -16px rgb(0 0 0 / .7), 0 0 0 1px rgb(255 255 255 / .04);
    --w-base:450;
    color-scheme:dark;
  }

  /* ===== 原型外壳(不属于设计稿) ===== */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font-ui);background:#e6e7eb;color:#1f2328;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none;cursor:pointer}
  .proto-bar{height:52px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#fff;border-bottom:1px solid #dadce1}
  .pb-title{display:flex;flex-direction:column;line-height:1.3;margin-right:auto}
  .pb-title b{font-size:14px;font-weight:600}
  .pb-title span{font-size:12px;color:#6b7280}
  .pb-ctrls{display:flex;gap:12px}
  .pseg{display:inline-flex;padding:2px;border-radius:8px;background:#eff0f3}
  .pseg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;font-size:13px;color:#4b5563;cursor:pointer}
  .pseg button[aria-pressed="true"]{background:#fff;color:#111827;font-weight:500;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
  .stage{height:calc(100vh - 52px);padding:20px;display:flex;gap:20px;justify-content:center;align-items:flex-start;overflow:auto}
  .frame{flex:1 1 auto;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -24px rgb(0 0 0 / .35),0 0 0 1px rgb(0 0 0 / .08)}
  .stage.single .frame{width:100%;height:100%;min-width:1100px}
  .stage.both .frame{flex:none;width:1280px;height:800px;zoom:var(--z,.5)}

  /* ===== 应用骨架 ===== */
  .app{height:100%;display:flex;flex-direction:column;background:rgb(var(--bg));color:rgb(var(--content));font-family:var(--font-ui);font-size:13px;line-height:1.45;font-weight:var(--w-base);transition:background-color var(--dur-2) var(--ease),color var(--dur-2) var(--ease)}
  .app ::selection,.spec ::selection{background:rgb(var(--accent) / .22)}
  .app :focus-visible{outline:2px solid rgb(var(--accent) / .55);outline-offset:1px}
  .app ::-webkit-scrollbar,.spec::-webkit-scrollbar{width:10px;height:10px}
  .app ::-webkit-scrollbar-thumb,.spec::-webkit-scrollbar-thumb{background:rgb(var(--content) / .14);border-radius:999px;border:3px solid transparent;background-clip:content-box}
  .app ::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--content) / .26)}
  .app ::-webkit-scrollbar-track{background:transparent}
  .app:not([data-view="chat"]) .only-chat,.app:not([data-view="welcome"]) .only-welcome,
  .app:not([data-view="settings"]) .only-settings,.app[data-view="settings"] .not-settings{display:none !important}
  .app[data-theme="dark"] .only-light,.app[data-theme="light"] .only-dark{display:none}

  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:14px;height:14px}
  .ic.xs{width:12px;height:12px}
  .ic.lg{width:22px;height:22px}
  .mono{font-family:var(--font-mono)}
  .ml-auto{margin-left:auto}
  .grow{flex:1}

  .icon-btn{width:28px;height:28px;flex:none;border:0;border-radius:var(--r-md);background:transparent;display:inline-grid;place-items:center;color:rgb(var(--content-3));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .icon-btn:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .icon-btn.sm{width:24px;height:24px;border-radius:var(--r-sm)}
  .kbd{margin-left:auto;display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid rgb(var(--edge));border-radius:5px;font-family:var(--font-mono);font-size:11px;font-weight:400;color:rgb(var(--content-3))}
  .chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:rgb(var(--hover));color:rgb(var(--content-2));font-size:11px}
  .badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:rgb(var(--accent) / .14);color:rgb(var(--accent-strong));font-size:11px;font-weight:600;line-height:1}
  .dot{width:6px;height:6px;flex:none;border-radius:50%;background:rgb(var(--accent))}
  .spin{width:12px;height:12px;flex:none;border-radius:50%;border:1.5px solid rgb(var(--accent) / .22);border-top-color:rgb(var(--accent));animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring{--p:0%;width:14px;height:14px;flex:none;border-radius:50%;background:conic-gradient(rgb(var(--accent)) 0 var(--p),rgb(var(--edge-strong)) var(--p) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}
  .dotsep{margin:0 2px;color:rgb(var(--content-3))}
  .avatar{--av:99 102 241;width:18px;height:18px;flex:none;border-radius:5px;display:inline-grid;place-items:center;background:rgb(var(--av) / .14);color:rgb(var(--av));font-size:11px;font-weight:600}

  /* ===== 标题栏(Windows 形态:右侧窗口按钮) ===== */
  .titlebar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding-left:10px;user-select:none}
  .tb-left{width:246px;flex:none;display:flex;align-items:center;gap:8px}
  .logo{width:20px;height:20px;flex:none;border-radius:6px;display:inline-grid;place-items:center;background:rgb(var(--accent));color:rgb(var(--on-accent));font-size:11px;font-weight:700}
  .brand{font-size:13px;font-weight:600}
  .crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:rgb(var(--content-3))}
  .crumbs .cur{font-size:13px;font-weight:500;color:rgb(var(--content));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumbs .chip{margin-left:4px}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
  .winctl{display:flex;margin-left:8px}
  .winctl span{width:46px;height:40px;display:grid;place-items:center;color:rgb(var(--content-2))}
  .winctl span:hover{background:rgb(var(--hover))}
  .winctl span.close:hover{background:#e81123;color:#fff}

  .body{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px 8px 0}
  .card{background:rgb(var(--surface));border:1px solid rgb(var(--edge));border-radius:var(--r-xl);box-shadow:var(--e1)}
  .app.no-side .sidebar,.app.no-side .set-nav{display:none}
  .app.no-side .body{padding-left:8px}
  .app.no-insp .inspector{display:none}

  /* ===== 左侧栏:直接落在窗口底色上,没有卡片、没有分隔线;结构和字号借鉴 Codex ===== */
  /* 顶部一列导航(新建会话 / 搜索 / 定时任务 / 插件与技能 / 连接手机),底部一行「设置」。
   * 行 14px / 30px 高,分组标题 13px 常规字重;选中用浅灰底加一条翡翠绿细条。
   * 默认「全部会话」:各项目的会话按时间混排,行首小色块标出所属项目;
   * 「按项目」用文件夹图标分组,会话缩进在项目下面。 */
  .sidebar{width:256px;flex:none;display:flex;flex-direction:column;min-height:0;padding:2px 8px 6px}
  .sidebar[data-sbmode="all"] .only-proj,.sidebar[data-sbmode="proj"] .only-all{display:none !important}
  .cx-nav{display:flex;flex-direction:column;gap:1px}
  .cx-item{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:var(--r-md);font-size:14px;color:rgb(var(--content));cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .cx-item .ic{color:rgb(var(--content-2))}
  .cx-item:hover{background:rgb(var(--hover))}
  .cx-item .kbd{opacity:0;transition:opacity var(--dur-1) var(--ease)}
  .cx-item:hover .kbd{opacity:1}
  .sb-tools{display:flex;align-items:center;justify-content:space-between;margin:12px 0 2px}
  .segctl.sm button{height:22px;padding:0 8px}
  .sb-tools .segctl{gap:2px;padding:0;background:transparent}
  .sb-tools .segctl button{color:rgb(var(--content-3))}
  .sb-tools .segctl button.on,[data-theme="dark"] .sb-tools .segctl button.on{background:rgb(var(--active));box-shadow:none;color:rgb(var(--content));font-weight:400}
  .sb-scope{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 6px;border:0;border-radius:var(--r-sm);background:transparent;font-size:12px;color:rgb(var(--content-3));cursor:pointer}
  .sb-scope:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .sb-scroll{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px 8px}
  .sb-group{height:28px;margin-top:6px;padding-left:10px;line-height:28px;font-size:13px;color:rgb(var(--content-3))}
  .sb-sess{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border-radius:var(--r-md);font-size:14px;color:rgb(var(--content));transition:background-color var(--dur-1) var(--ease)}
  .sb-sess:hover{background:rgb(var(--hover))}
  .sb-sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-sess .m{font-size:12px;color:rgb(var(--content-3))}
  .sb-sess .wt{margin-right:-4px;color:rgb(var(--content-3))}
  .sb-sess.active{background:rgb(var(--active))}
  .sb-sess.active::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:12px;margin-top:-6px;border-radius:3px;background:rgb(var(--accent))}
  .sb-proj{display:flex;align-items:center;gap:8px;height:30px;margin-top:2px;padding:0 8px 0 10px;border-radius:var(--r-md);font-size:14px;color:rgb(var(--content));cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .sb-proj:hover{background:rgb(var(--hover))}
  .sb-proj .fold{color:rgb(var(--content-2))}
  .sb-proj .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-proj .m{font-size:12px;color:rgb(var(--content-3))}
  .only-proj .sb-sess{padding-left:34px}
  .only-proj .sb-sess.active::before{left:22px}
  .sb-more{display:block;height:28px;padding-left:10px;line-height:28px;font-size:13px;color:rgb(var(--content-3))}
  .only-proj .sb-more{padding-left:34px}
  .sb-more:hover{color:rgb(var(--content))}
  .sb-foot{display:flex;align-items:center;gap:2px;padding:6px 0 0}
  .avatar.xs{width:16px;height:16px;border-radius:4px}

  /* ===== 中间工作区:会话 ===== */
  .chat-card{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .chat-scroll{flex:1;min-height:0;overflow:auto}
  .chat-col{max-width:760px;margin:0 auto;padding:56px 32px 28px}
  .msg-user{display:flex;justify-content:flex-end;margin-bottom:16px}
  .bubble{max-width:78%;padding:10px 14px;border-radius:12px 12px 4px 12px;background:rgb(var(--bubble));font-size:15px;line-height:1.6}
  .turn-meta{display:flex;align-items:center;gap:12px;margin:4px 0 18px;font-size:11px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .turn-meta::before,.turn-meta::after{content:"";flex:1;height:1px;background:rgb(var(--edge))}
  .prose{font-size:15px;line-height:1.7}
  .prose p{margin:0 0 12px}
  .prose strong{font-weight:600}
  .prose h3{margin:22px 0 8px;font-size:16px;font-weight:600;line-height:1.4}
  .prose code,.spec code{padding:1px 5px;border:1px solid rgb(var(--edge));border-radius:var(--r-sm);background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:.86em}
  .prose a,.link{border-bottom:1px solid rgb(var(--accent) / .35);color:rgb(var(--accent-strong));cursor:pointer}
  .prose a:hover,.link:hover{border-bottom-color:rgb(var(--accent))}

  .tools{display:flex;flex-direction:column;gap:6px;margin:4px 0 16px}
  .tools-head{display:flex;align-items:center;gap:6px;height:22px;font-size:12px;color:rgb(var(--content-3));cursor:pointer}
  .tool{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface));font-size:13px;line-height:1;cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .tool:hover{background:rgb(var(--surface-2))}
  .tool .st{width:16px;height:16px;flex:none;display:grid;place-items:center;color:rgb(var(--content-3))}
  .tool .verb{font-weight:500;color:rgb(var(--content))}
  .tool .target{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:12px;color:rgb(var(--content-2))}
  .tool .dur{font-size:11px;color:rgb(var(--content-3));font-variant-numeric:tabular-nums}
  .tool.fail{border-color:rgb(var(--danger) / .35)}
  .tool.fail .st,.tool.fail .dur{color:rgb(var(--danger))}
  .tool.run .dur{color:rgb(var(--content-2))}

  .codeblock{margin:12px 0 16px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface-2));overflow:hidden}
  .cb-head{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 6px 0 12px;border-bottom:1px solid rgb(var(--edge));font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}
  .codeblock pre{margin:0;padding:12px 0;overflow:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.7}
  .codeblock .ln{display:block;padding:0 14px;white-space:pre}
  .codeblock .ln.add{background:rgb(var(--success) / .09);color:rgb(var(--success))}
  .tok-kw{color:rgb(var(--syn-kw))}
  .tok-str{color:rgb(var(--syn-str))}
  .tok-fn{color:rgb(var(--syn-fn))}
  .tok-com{color:rgb(var(--content-3));font-style:italic}

  .prose table{width:100%;margin:6px 0 16px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);border-collapse:separate;border-spacing:0;overflow:hidden;font-size:13px;line-height:1.5}
  .prose th{padding:8px 12px;border-bottom:1px solid rgb(var(--edge));background:rgb(var(--surface-2));text-align:left;font-size:12px;font-weight:500;color:rgb(var(--content-2))}
  .prose td{padding:8px 12px;border-bottom:1px solid rgb(var(--edge))}
  .prose tr:last-child td{border-bottom:0}
  .pass{display:inline-flex;align-items:center;gap:4px;font-weight:500;color:rgb(var(--accent-strong))}
  .muted{color:rgb(var(--content-3))}

  .files{margin:4px 0 14px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);overflow:hidden}
  .files-head{display:flex;align-items:center;height:40px;padding:0 6px 0 12px;border-bottom:1px solid rgb(var(--edge));background:rgb(var(--surface-2));font-size:13px;font-weight:500}
  .files-head .btn{margin-left:auto}
  .file-row{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;font-family:var(--font-mono);font-size:12px;color:rgb(var(--content-2))}
  .file-row .path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-row b{font-weight:500;color:rgb(var(--content))}
  .add{color:rgb(var(--success))}
  .del{color:rgb(var(--danger))}

  .activity{position:absolute;top:12px;right:14px;z-index:2;display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid rgb(var(--edge));border-radius:999px;background:rgb(var(--surface));box-shadow:var(--e1);font-size:12px;color:rgb(var(--content-2))}
  .vsep{width:1px;height:12px;background:rgb(var(--edge))}
  .mini{width:34px;height:4px;border-radius:999px;background:rgb(var(--edge));overflow:hidden}
  .mini i{display:block;height:100%;border-radius:inherit;background:rgb(var(--content-3))}

  /* ===== 输入框:保留现有药丸结构,只统一尺寸和聚焦态 ===== */
  .composer-wrap{position:relative;flex:none;padding:0 32px 18px}
  .composer-wrap::before{content:"";position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(rgb(var(--surface) / 0),rgb(var(--surface)));pointer-events:none}
  .composer{max-width:760px;margin:0 auto;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-xl);background:rgb(var(--surface));box-shadow:var(--e2);transition:border-color var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease)}
  .composer:focus-within{border-color:rgb(var(--accent) / .5);box-shadow:var(--e2),0 0 0 3px rgb(var(--accent) / .12)}
  .composer textarea{display:block;width:100%;min-height:54px;padding:14px 16px 4px;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:15px;line-height:1.6;color:rgb(var(--content))}
  .composer textarea::placeholder{color:rgb(var(--content-3))}
  .composer textarea:focus-visible{outline:none}
  .composer-bar{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 10px}
  .pill{display:inline-flex;align-items:stretch;height:28px;border:1px solid rgb(var(--edge));border-radius:999px;overflow:hidden}
  .seg{display:inline-flex;align-items:center;gap:5px;padding:0 10px;border:0;background:transparent;font-size:12px;color:rgb(var(--content-2));white-space:nowrap;cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .seg+.seg{border-left:1px solid rgb(var(--edge))}
  .seg:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .seg.icon{padding:0 8px}
  .seg .caret{color:rgb(var(--content-3))}
  .claude{color:#d97757}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:4px}
  .send{width:30px;height:30px;flex:none;border:0;border-radius:50%;display:inline-grid;place-items:center;background:rgb(var(--accent));color:rgb(var(--on-accent));box-shadow:0 1px 2px rgb(var(--accent) / .35);cursor:pointer;transition:transform var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease)}
  .send:hover{background:rgb(var(--accent-strong))}
  .send:active{transform:scale(.94)}
  .send .ic{stroke-width:2}

  /* ===== 右侧面板:单独一张悬浮卡片 ===== */
  .inspector{width:300px;flex:none;display:flex;flex-direction:column;overflow:hidden}
  .insp-head{display:flex;align-items:center;gap:4px;padding:8px;border-bottom:1px solid rgb(var(--edge))}
  .segctl{display:inline-flex;padding:2px;border-radius:var(--r-md);background:rgb(var(--hover))}
  .segctl button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:0;border-radius:var(--r-sm);background:transparent;font-size:12px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .segctl button:hover{color:rgb(var(--content))}
  .segctl button.on{background:rgb(var(--surface));color:rgb(var(--content));font-weight:500;box-shadow:var(--e1)}
  [data-theme="dark"] .segctl button.on{background:rgb(var(--active))}
  .insp-path{display:flex;align-items:center;gap:6px;padding:10px 14px 6px;font-size:12px;color:rgb(var(--content-3))}
  .tree{flex:1;min-height:0;overflow:auto;padding:0 6px 10px}
  .row{--d:0;display:flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 calc(8px + var(--d) * 14px);border-radius:var(--r-sm);font-size:13px;color:rgb(var(--content-2));white-space:nowrap;cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .row:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .row.sel{background:rgb(var(--active));color:rgb(var(--content))}
  .row .chev,.row .fd{color:rgb(var(--content-3))}
  .chev-sp{display:inline-block;width:12px;flex:none}
  .ft{--ft:var(--content-3);color:rgb(var(--ft))}
  .git{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:600}
  .git.m{color:rgb(var(--warning))}
  .git.a{color:rgb(var(--success))}
  .insp-foot{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-top:1px solid rgb(var(--edge));font-size:12px;color:rgb(var(--content-3))}

  /* ===== 欢迎页(没有打开会话时) ===== */
  .welcome{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px 56px}
  .wl-mark{width:48px;height:48px;margin-bottom:18px;border-radius:14px;display:grid;place-items:center;background:rgb(var(--accent) / .1);color:rgb(var(--accent))}
  .wl-title{margin:0 0 8px;font-size:24px;font-weight:500}
  .wl-sub{display:flex;align-items:center;gap:6px;margin:0 0 24px;font-size:12px;color:rgb(var(--content-3))}
  .welcome .composer{width:100%;max-width:680px;margin:0}
  .welcome .composer textarea{min-height:76px}
  .wl-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 36px}
  .qa{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border:1px solid rgb(var(--edge));border-radius:999px;background:rgb(var(--surface));font-size:13px;color:rgb(var(--content-2));cursor:pointer;transition:border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .qa:hover{border-color:rgb(var(--edge-strong));color:rgb(var(--content));box-shadow:var(--e1)}
  .qa .ic{color:rgb(var(--content-3))}
  .wl-recent{width:100%;max-width:680px}
  .wl-recent h4{margin:0 0 6px 10px;font-size:13px;font-weight:400;color:rgb(var(--content-3))}
  .rc{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:var(--r-md);transition:background-color var(--dur-1) var(--ease)}
  .rc:hover{background:rgb(var(--hover))}
  .rc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:rgb(var(--content))}
  .rc .p{font-size:12px;color:rgb(var(--content-3))}
  .rc .m{width:72px;text-align:right;font-size:11px;color:rgb(var(--content-3))}

  /* ===== 待确认卡片:停靠在输入框正上方,一次只出现一张(工具审批 > 计划审批 > 提问) ===== */
  .dock{display:none;max-width:760px;margin:0 auto 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-lg);background:rgb(var(--surface));box-shadow:var(--e2);overflow:hidden}
  .app[data-prompt="approve"] .dock.approve,.app[data-prompt="plan"] .dock.plan,.app[data-prompt="ask"] .dock.ask{display:block}
  .app[data-prompt="ask"] .composer{opacity:.55;pointer-events:none}
  .dk-head{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 8px 0 14px;font-size:13px;font-weight:500;color:rgb(var(--content))}
  .dk-head>.ic{color:rgb(var(--content-2))}
  .dk-head .muted{font-size:12px;font-weight:400}
  .dk-body{padding:0 14px 14px}
  .dk-cmd{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:rgb(var(--content))}
  .dk-cmd .k{flex:none;font-family:var(--font-ui);font-size:12px;font-weight:500;color:rgb(var(--content-3))}
  .dk-note{margin:8px 2px 0;font-size:12px;line-height:1.55;color:rgb(var(--content-2))}
  .dk-detail{display:none;margin:8px 0 0;padding:10px 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-family:var(--font-mono);font-size:12px;line-height:1.6;color:rgb(var(--content-2));white-space:pre;overflow:auto}
  .dock.open .dk-detail{display:block}
  .dock.open [data-act="detail"] .ic{transform:rotate(180deg)}
  .dk-foot{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 10px 8px 14px;border-top:1px solid rgb(var(--edge));background:rgb(var(--surface-2))}
  .dk-foot .muted{font-size:12px}
  .input.dk-input{display:block;width:100%;margin-top:10px}
  .btn .kbd{margin-left:2px;height:16px;padding:0 4px;border-color:currentColor;color:inherit;opacity:.6}
  .check{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:rgb(var(--content-2));cursor:pointer;user-select:none}
  .check i{position:relative;width:14px;height:14px;flex:none;border:1.5px solid rgb(var(--edge-strong));border-radius:4px;transition:background-color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
  .check.on i{border-color:rgb(var(--accent));background:rgb(var(--accent))}
  .check.on i::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid rgb(var(--on-accent));border-width:0 1.75px 1.75px 0;transform:rotate(45deg)}
  .plan-doc{padding:12px 14px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface-2));font-size:13px;line-height:1.6}
  .plan-doc b{display:block;margin-bottom:4px;font-weight:600}
  .plan-doc ol{margin:0;padding-left:20px;color:rgb(var(--content-2))}
  .plan-doc code{padding:0 4px;border:1px solid rgb(var(--edge));border-radius:5px;background:rgb(var(--surface));font-family:var(--font-mono);font-size:.86em}
  .q-text{margin:0 0 10px;font-size:14px;font-weight:500;line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);cursor:pointer;transition:background-color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
  .opt:hover{background:rgb(var(--hover))}
  .opt.on{border-color:rgb(var(--edge-strong));background:rgb(var(--active))}
  .opt b{display:block;font-size:13px;font-weight:500;color:rgb(var(--content))}
  .opt .od{display:block;font-size:12px;color:rgb(var(--content-3))}
  .radio{position:relative;width:14px;height:14px;flex:none;margin-top:3px;border:1.5px solid rgb(var(--edge-strong));border-radius:50%}
  .opt.on .radio{border-color:rgb(var(--accent))}
  .opt.on .radio::after{content:"";position:absolute;inset:2px;border-radius:50%;background:rgb(var(--accent))}

  /* ===== 设置页:导航直接落在窗口底色上,内容是一张悬浮卡片;每项都是「标题 + 说明 + 控件」 ===== */
  .set-nav{width:256px;flex:none;display:flex;flex-direction:column;min-height:0;padding:2px 8px 4px}
  .set-back{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:var(--r-md);background:transparent;font-size:13px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .set-back:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .set-search{display:flex;align-items:center;gap:6px;height:30px;margin-top:6px;padding:0 10px;border:1px solid rgb(var(--edge));border-radius:var(--r-md);background:rgb(var(--surface));box-shadow:var(--e1);color:rgb(var(--content-3));transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .set-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:rgb(var(--content))}
  .set-search input::placeholder{color:rgb(var(--content-3))}
  .set-search input:focus-visible{outline:none}
  .set-search:focus-within{border-color:rgb(var(--accent) / .5);box-shadow:0 0 0 3px rgb(var(--accent) / .12)}
  .set-groups{flex:1;min-height:0;overflow:auto;margin:4px -4px 0;padding:0 4px 8px}
  .set-group{height:26px;margin-top:4px;padding-left:10px;line-height:26px;font-size:13px;color:rgb(var(--content-3))}
  .set-item{position:relative;display:flex;align-items:center;gap:10px;height:28px;padding:0 10px;border-radius:var(--r-md);font-size:14px;color:rgb(var(--content));transition:background-color var(--dur-1) var(--ease)}
  .set-item .ic{color:rgb(var(--content-2))}
  .set-item:hover{background:rgb(var(--hover))}
  .set-item.active{background:rgb(var(--active))}
  .set-item.active::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:12px;margin-top:-6px;border-radius:3px;background:rgb(var(--accent))}
  .set-card{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .set-scroll{flex:1;min-height:0;overflow:auto}
  .set-col{max-width:720px;margin:0 auto;padding:40px 32px 48px}
  .set-title{margin:0 0 6px;font-size:24px;font-weight:500}
  .set-desc{margin:0 0 28px;color:rgb(var(--content-2))}
  .set-sec{margin-bottom:24px}
  .set-sec h3{margin:0 0 8px 2px;font-size:13px;font-weight:500;color:rgb(var(--content-3))}
  .set-box{border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface))}
  .set-row{display:flex;align-items:center;gap:24px;min-height:60px;padding:12px 16px}
  .set-row+.set-row{border-top:1px solid rgb(var(--edge))}
  .set-row .txt{flex:1;min-width:0}
  .set-row .txt b{display:block;font-weight:500}
  .set-row .txt span{display:block;margin-top:2px;font-size:12px;line-height:1.5;color:rgb(var(--content-3))}
  .set-row .ctl{flex:none;display:flex;align-items:center;gap:8px}
  .swatch-row{display:flex;align-items:center;gap:8px}
  .swc{--c:5 150 105;width:18px;height:18px;flex:none;padding:0;border:0;border-radius:50%;background:rgb(var(--c));box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08);cursor:pointer;transition:box-shadow var(--dur-1) var(--ease)}
  .swc.on{box-shadow:0 0 0 2px rgb(var(--surface)),0 0 0 3.5px rgb(var(--c))}
  .stepper{display:inline-flex;align-items:stretch;height:30px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));overflow:hidden}
  .stepper button{width:30px;border:0;background:transparent;font-size:15px;color:rgb(var(--content-2));cursor:pointer;transition:background-color var(--dur-1) var(--ease)}
  .stepper button:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .stepper span{min-width:56px;display:grid;place-items:center;border-left:1px solid rgb(var(--edge));border-right:1px solid rgb(var(--edge));font-variant-numeric:tabular-nums}
  .select{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:188px;height:30px;padding:0 8px 0 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);background:rgb(var(--surface));font-size:13px;color:rgb(var(--content));cursor:pointer;transition:border-color var(--dur-1) var(--ease)}
  .select .ic{color:rgb(var(--content-3))}
  .select:hover{border-color:rgb(var(--content-3))}
  .set-foot{margin:0 2px;font-size:12px;color:rgb(var(--content-3))}

  /* ===== 基础组件 ===== */
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid transparent;border-radius:var(--r-md);font-size:13px;font-weight:500;cursor:pointer;transition:background-color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
  .btn.sm{height:28px;padding:0 10px;font-size:12px}
  .btn-primary{background:rgb(var(--accent));color:rgb(var(--on-accent))}
  .btn-primary:hover{background:rgb(var(--accent-strong))}
  .btn-secondary{border-color:rgb(var(--edge-strong));background:rgb(var(--surface));color:rgb(var(--content));box-shadow:var(--e1)}
  .btn-secondary:hover{background:rgb(var(--surface-2))}
  .btn-ghost{background:transparent;color:rgb(var(--content-2))}
  .btn-ghost:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .btn-danger{border-color:rgb(var(--danger) / .35);background:transparent;color:rgb(var(--danger))}
  .btn-danger:hover{background:rgb(var(--danger) / .08)}
  .btn:disabled{opacity:.45;pointer-events:none}
  .input{width:180px;height:32px;padding:0 10px;border:1px solid rgb(var(--edge-strong));border-radius:var(--r-md);outline:none;background:rgb(var(--surface));font:inherit;font-size:13px;color:rgb(var(--content));transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
  .input::placeholder{color:rgb(var(--content-3))}
  .input:focus,.input.focused{border-color:rgb(var(--accent) / .6);box-shadow:0 0 0 3px rgb(var(--accent) / .14)}
  .switch{position:relative;display:inline-block;width:32px;height:18px;flex:none;border-radius:999px;background:rgb(var(--edge-strong));cursor:pointer;transition:background-color var(--dur-2) var(--ease)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform var(--dur-2) var(--ease)}
  .switch.on{background:rgb(var(--accent))}
  .switch.on::after{transform:translateX(14px)}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-sm);background:rgb(var(--info) / .12);color:rgb(var(--info));font-size:11px;font-weight:500}
  .tip{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:var(--r-sm);background:rgb(var(--content));color:rgb(var(--surface));font-size:12px;box-shadow:var(--e2)}
  .menu{width:240px;padding:4px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface));box-shadow:var(--e2)}
  .mi{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:var(--r-sm);font-size:13px;color:rgb(var(--content-2));cursor:pointer}
  .mi .ic{color:rgb(var(--content-3))}
  .mi.hov,.mi:hover{background:rgb(var(--hover));color:rgb(var(--content))}
  .mi.danger,.mi.danger .ic{color:rgb(var(--danger))}
  .msep{height:1px;margin:4px 6px;background:rgb(var(--edge))}

  /* ===== 设计规范页 ===== */
  .spec{height:100%;overflow:auto;background:rgb(var(--bg));color:rgb(var(--content));font-family:var(--font-ui);font-size:13px;line-height:1.5;font-weight:var(--w-base)}
  .spec-inner{max-width:980px;margin:0 auto;padding:32px 36px 60px}
  .spec h2{margin:0 0 6px;font-size:20px;font-weight:600}
  .spec .lead{margin:0 0 24px;color:rgb(var(--content-2))}
  .spec section{margin-bottom:16px;padding:20px 22px;border:1px solid rgb(var(--edge));border-radius:var(--r-xl);background:rgb(var(--surface));box-shadow:var(--e1)}
  .spec section.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .spec h3{margin:0 0 14px;font-size:14px;font-weight:600}
  .note{margin:14px 0 0;font-size:12px;color:rgb(var(--content-3))}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{border:1px solid rgb(var(--edge));border-radius:var(--r-lg);overflow:hidden}
  .sw i{display:block;height:44px;border-bottom:1px solid rgb(var(--edge))}
  .sw div{padding:7px 9px 8px}
  .sw b{display:block;font-size:12px;font-weight:500}
  .sw span{display:block;font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}
  .accent-uses{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px}
  .use{display:flex;align-items:center;gap:10px;min-height:34px;font-size:13px;color:rgb(var(--content-2))}
  .use-bar{width:3px;height:16px;border-radius:3px;background:rgb(var(--accent))}
  .ts-row{display:grid;grid-template-columns:90px 1fr 200px;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid rgb(var(--edge))}
  .ts-row:last-child{border-bottom:0}
  .ts-k{font-family:var(--font-mono);font-size:11px;color:rgb(var(--content-3))}
  .ts-u{text-align:right;font-size:12px;color:rgb(var(--content-3))}
  .radii{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .radii div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .radii i{width:56px;height:40px;border:1.5px solid rgb(var(--edge-strong));background:rgb(var(--surface-2))}
  .radii b{font-size:12px;font-weight:600}
  .radii span,.elev span{font-size:11px;line-height:1.4;color:rgb(var(--content-3))}
  .elev{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:6px}
  .elev div{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgb(var(--edge));border-radius:var(--r-lg);background:rgb(var(--surface))}
  .elev b{font-family:var(--font-mono);font-size:12px}
  .comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
  .comp{display:flex;flex-direction:column;gap:8px}

            </div>
            <h3>原因</h3>
            <p>提交 <code>b2dfcdb</code> 把构建脚本改成了 <code>write: false</code>，却没有把产物写回磁盘，于是 <code>piHost.mjs</code> 一直停在旧版本，里面还带着 Electron 依赖。</p>

            </div>
            <table>
              <thead><tr><th>检查项</th><th>结果</th></tr></thead>
              <tbody>
                <tr><td>构建产物不含 Electron 导入</td><td><span class="pass"><svg class="ic xs"><use href="#i-check"/></svg>通过</span></td></tr>

      <div class="ts-row"><span class="ts-k">13 · 400</span><span style="font-size:13px;color:rgb(var(--content-2))">菜单、按钮、文件树、分组标题</span><span class="ts-u">界面正文</span></div>
      <div class="ts-row"><span class="ts-k">12 · 400</span><span style="font-size:12px;color:rgb(var(--content-2))">工具目标、表头、面包屑、会话时间</span><span class="ts-u">次要信息</span></div>
      <div class="ts-row"><span class="ts-k">11 · 500</span><span style="font-size:11px;font-weight:500;color:rgb(var(--content-3))">计数、徽标、代码块头</span><span class="ts-u">辅助信息</span></div>
    </section>

    <section class="two">
      <div>
        <h3>圆角</h3>
        <div class="radii">
          <div><i style="border-radius:6px"></i><b>6</b><span>行内代码、徽标、文件树行</span></div>
          <div><i style="border-radius:8px"></i><b>8</b><span>按钮、输入框、列表行</span></div>
          <div><i style="border-radius:12px"></i><b>12</b><span>卡片、代码块、弹层</span></div>
          <div><i style="border-radius:16px"></i><b>16</b><span>工作区、输入框卡片</span></div>
          <div><i style="border-radius:999px"></i><b>全圆</b><span>胶囊、开关</span></div>
        </div>
      </div>
      <div>
        <h3>阴影</h3>
        <div class="elev">
          <div style="box-shadow:var(--e1)"><b>e1</b><span>卡片、选中行</span></div>
          <div style="box-shadow:var(--e2)"><b>e2</b><span>弹层、输入框</span></div>
          <div style="box-shadow:var(--e3)"><b>e3</b><span>对话框</span></div>

    <section>

        <div class="comp"><span class="lbl">输入框</span><div class="hstack"><input class="input" placeholder="搜索会话…"><input class="input focused" value="聚焦态" readonly></div></div>
        <div class="comp"><span class="lbl">开关 · 分段</span><div class="hstack"><span class="switch on"></span><span class="switch"></span><div class="segctl"><button class="on">浅色</button><button>深色</button><button>跟随系统</button></div></div></div>
        <div class="comp"><span class="lbl">标签 · 提示</span><div class="hstack"><span class="chip mono"><svg class="ic xs"><use href="#i-branch"/></svg>master</span><span class="badge">2</span><span class="tag">计划模式</span><span class="tip">Ctrl K 打开命令面板</span></div></div>
        <div class="comp"><span class="lbl">菜单</span>
          <div class="menu">
            <div class="mi"><svg class="ic sm"><use href="#i-msg"/></svg>重命名</div>
            <div class="mi hov"><svg class="ic sm"><use href="#i-fork"/></svg>在工作树中新建会话</div>
            <div class="mi"><svg class="ic sm"><use href="#i-folder"/></svg>在资源管理器中显示</div>
            <div class="msep"></div>
            <div class="mi danger"><svg class="ic sm"><use href="#i-x"/></svg>删除会话</div>

    </section>

    <section>
      <h3>和现在比</h3>
      <table class="cmp">
        <thead><tr><th>项目</th><th>现在</th><th>方案</th></tr></thead>
        <tbody>
          <tr><td>最小字号</td><td>7px</td><td>11px</td></tr>
          <tr><td>界面常用字号</td><td>10–11px（共 344 处）</td><td>13–14px，聊天正文 15px</td></tr>
          <tr><td>基础字重</td><td>浅色 500 / 深色 600</td><td>400 / 450</td></tr>
          <tr><td>圆角</td><td>7 种混用</td><td>6 / 8 / 12 / 16 + 全圆</td></tr>
          <tr><td>阴影</td><td><code>shadow-2xl</code> 用了 41 处</td><td>e1 / e2 / e3 三档</td></tr>
          <tr><td>聊天正文宽度</td><td>1024px</td><td>760px（代码块、表格可以更宽）</td></tr>
          <tr><td>三栏结构</td><td>中间区左侧圆角，靠分隔线分栏</td><td>中间区、右侧面板都是悬浮卡片</td></tr>
          <tr><td>背景模糊</td><td>11 处</td><td>不新增，逐步去掉滚动区里的</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
</template>

<script>
  const SWATCHES = [
    ["--bg", "窗口底色"], ["--surface", "工作区"], ["--surface-2", "内衬"], ["--hover", "悬停"], ["--active", "选中"],
    ["--edge", "分隔线"], ["--edge-strong", "描边"], ["--content", "正文"], ["--content-2", "次要文字"], ["--content-3", "辅助文字"],
    ["--accent", "翡翠绿"], ["--accent-strong", "翡翠绿文字"], ["--danger", "危险"], ["--warning", "警告"], ["--info", "信息"],
  ];
  // 翠绿就是主题 token 里的默认值;其余每套主题给 [强调色, 小号文字色, 强调色上的文字色(缺省白)]
  const ACCENTS = {
    emerald: null,
    sky: { light: ["2 132 199", "3 105 161"], dark: ["14 165 233", "56 189 248", "8 25 40"] },
    indigo: { light: ["79 70 229", "67 56 202"], dark: ["99 102 241", "129 140 248"] },
    violet: { light: ["124 58 237", "109 40 217"], dark: ["139 92 246", "167 139 250"] },
    rose: { light: ["225 29 72", "190 18 60"], dark: ["244 63 94", "251 113 133"] },
    amber: { light: ["217 119 6", "180 83 9"], dark: ["245 158 11", "251 191 36", "40 22 2"] },
    gray: { light: ["82 82 91", "63 63 70"], dark: ["161 161 170", "212 212 216", "18 18 20"] },
  };
  const state = { view: "chat", theme: "light", prompt: "none" };
  for (const tok of location.hash.slice(1).split(/[&,]/)) {
    if (["chat", "welcome", "settings", "spec"].includes(tok)) state.view = tok;
    if (["light", "dark", "both"].includes(tok)) state.theme = tok;
    if (["approve", "plan", "ask"].includes(tok)) state.prompt = tok;
    if (tok === "proj") state.sbmode = "proj";
  }
  const stage = document.getElementById("stage");

  function hex(triplet) {
    return "#" + triplet.trim().split(/\s+/).map((n) => Number(n).toString(16).padStart(2, "0")).join("").toUpperCase();
  }

  function fillSwatches(root) {
    const box = root.querySelector("[data-swatches]");
    if (!box) return;
    const cs = getComputedStyle(root);
    box.innerHTML = SWATCHES.map(([name, label]) => {
      const value = cs.getPropertyValue(name).trim();
      return `<div class="sw"><i style="background:rgb(${value})"></i><div><b>${label}</b><span>${name}</span><span>${hex(value)}</span></div></div>`;
    }).join("");
  }

  function wire(root) {
    root.querySelectorAll("[data-act]").forEach((btn) => btn.addEventListener("click", () => {
      const app = btn.closest(".app");
      const act = btn.dataset.act;
      if (act === "theme") {
        app.dataset.theme = app.dataset.theme === "dark" ? "light" : "dark";
        delete app.dataset.themePref;
        syncTheme(app);
      }
      if (act === "inspector") app.classList.toggle("no-insp");
      if (act === "sidebar") app.classList.toggle("no-side");
      if (act === "settings") go("settings");
      if (act === "back") go("chat");
      if (act === "detail") btn.closest(".dock").classList.toggle("open");
      if (act === "check") btn.classList.toggle("on");
      if (act === "resolve") {
        state.prompt = "none";
        document.querySelectorAll(".app").forEach((a) => { a.dataset.prompt = "none"; });
        markPressed();
        saveHash();
      }
    }));
    root.querySelectorAll(".segctl").forEach((seg) => seg.addEventListener("click", (event) => {
      const target = event.target.closest("button");
      if (!target) return;
      seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === target));
      if (seg.hasAttribute("data-sbmode")) {
        state.sbmode = target.dataset.mode;
        seg.closest(".sidebar").dataset.sbmode = target.dataset.mode;
      }
      if (seg.hasAttribute("data-themectl")) {
        const app = seg.closest(".app");
        const pref = target.dataset.t;
        app.dataset.themePref = pref;
        app.dataset.theme = pref === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
        syncTheme(app);
      }
    }));
    root.querySelectorAll("[data-accents] .swc").forEach((sw) => sw.addEventListener("click", () => {
      const app = sw.closest(".app");
      sw.parentElement.querySelectorAll(".swc").forEach((b) => b.classList.toggle("on", b === sw));
      app.dataset.accent = sw.dataset.accent;
      applyAccent(app);
    }));
    root.querySelectorAll(".opts").forEach((box) => box.addEventListener("click", (event) => {
      const opt = event.target.closest(".opt");
      if (opt) box.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o === opt));
    }));
  }

  function applyAccent(app) {
    ["--accent", "--accent-strong", "--on-accent"].forEach((p) => app.style.removeProperty(p));
    const pick = ACCENTS[app.dataset.accent];
    if (!pick) return;
    const [accent, strong, on = "255 255 255"] = pick[app.dataset.theme === "dark" ? "dark" : "light"];
    app.style.setProperty("--accent", accent);
    app.style.setProperty("--accent-strong", strong);
    app.style.setProperty("--on-accent", on);
  }

  function syncTheme(app) {
    applyAccent(app);
    const pref = app.dataset.themePref || app.dataset.theme;
    app.querySelectorAll("[data-themectl] button").forEach((b) => b.classList.toggle("on", b.dataset.t === pref));
  }

  function markPressed() {
    document.querySelectorAll(".pseg").forEach((group) => group.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(state[group.dataset.group] === b.dataset.v));
    }));
  }

  function saveHash() {
    const parts = [state.view, state.theme];
    if (state.prompt !== "none") parts.push(state.prompt);
    history.replaceState(null, "", "#" + parts.join("&"));
  }

  function go(view) {
    state.view = view;
    saveHash();
    render();
  }

  function applySidebarMode(root) {
    const sidebar = root.querySelector(".sidebar");
    if (!sidebar || !state.sbmode) return;
    sidebar.dataset.sbmode = state.sbmode;
    sidebar.querySelectorAll("[data-sbmode] button").forEach((b) => b.classList.toggle("on", b.dataset.mode === state.sbmode));
  }

  function fit() {
    if (state.theme !== "both") return;
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const z = Math.min((w - 20) / 2560, h / 800);
    stage.style.setProperty("--z", Math.max(0.3, z).toFixed(3));
  }

  function render() {
    markPressed();
    stage.className = "stage " + (state.theme === "both" ? "both" : "single");
    stage.innerHTML = "";
    const themes = state.theme === "both" ? ["light", "dark"] : [state.theme];
    for (const theme of themes) {
      const frame = document.createElement("div");
      frame.className = "frame";
      const tpl = document.getElementById(state.view === "spec" ? "tpl-spec" : "tpl-app");
      const node = tpl.content.firstElementChild.cloneNode(true);
      node.dataset.theme = theme;
      if (state.view !== "spec") {
        node.dataset.view = state.view;
        node.dataset.prompt = state.prompt;
      }
      frame.appendChild(node);
      stage.appendChild(frame);
      wire(node);
      applySidebarMode(node);
      if (state.view !== "spec") syncTheme(node);
      fillSwatches(node);
    }
    fit();
  }

  document.querySelectorAll(".pseg").forEach((group) => group.addEventListener("click", (event) => {
    const b = event.target.closest("button");
    if (!b) return;
    state[group.dataset.group] = b.dataset.v;
    if (group.dataset.group === "prompt" && b.dataset.v !== "none") state.view = "chat";
    saveHash();
    render();
  }));
  window.addEventListener("resize", fit);
  render();
</script>
</body>
</html>
